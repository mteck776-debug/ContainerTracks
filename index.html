<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRF Life</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1c2530">
<meta name="apple-mobile-web-app-title" content="MRF Life">
<meta name="application-name" content="MRF Life">
<style>
  :root{
    --bg:#eef1f4; --panel:#fff; --ink:#18202a; --muted:#66707c; --line:#d8dde3;
    --accent:#e2701a; --accent-ink:#fff; --good:#1f8a4c; --bad:#c0392b; --warn:#b7791f;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#1c2530;color:#fff;position:sticky;top:0;z-index:5}
  .bar-top{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:8px}
  .brand i{display:inline-block;width:22px;height:14px;border:3px solid var(--accent);border-radius:2px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;color:#c9d2dc;border:0;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
  nav button.on{background:#2e3a48;color:#fff}
  .spacer{flex:1}
  main{max-width:1280px;margin:0 auto;padding:18px}
  h2{margin:0 0 12px;font-size:20px}
  h3{margin:0 0 8px;font-size:16px}
  .muted{color:var(--muted);font-size:13px}
  button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#aab3bd}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button.danger{color:var(--bad)}
  button.small{padding:4px 8px;font-size:13px}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
  input:focus,select:focus{outline:2px solid #f3b27f;border-color:var(--accent)}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
  .panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  /* yard */
  .yard{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .bay{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;border-top:6px solid var(--mc,#999);display:flex;flex-direction:column;gap:8px}
  .bay.empty{border-top-color:#c3c9d0;background:repeating-linear-gradient(45deg,#fff,#fff 10px,#f6f7f9 10px,#f6f7f9 20px);align-items:center;justify-content:center;min-height:250px;text-align:center}
  .bay-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bay-no{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;background:var(--mc,#888);font-weight:700;font-size:12px}
  .bay-head select{font-weight:700;padding:4px 8px}
  .cid{font-size:19px;font-weight:700;font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
  .bales{display:flex;align-items:center;gap:6px}
  .bales button.fill{min-width:0;flex:1;font-size:14px;background:var(--good);border-color:var(--good);color:#fff}
  .bales button.fill:disabled{background:#e7eaee;border-color:var(--line);color:var(--muted);cursor:default}
  .bales input{width:64px;text-align:center;font-size:26px;font-weight:800;padding:4px}
  .bales button{min-width:40px;font-size:17px;font-weight:700;padding:8px}
  .gauge{height:8px;background:#e7eaee;border-radius:9px;overflow:hidden}
  .gauge i{display:block;height:100%;background:var(--mc,#888);transition:width .2s}
  .target{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .target .gauge{height:12px}
  .target.hit{background:#e9f7ef;border-color:#9fd8b6} .target.hit .gauge i{background:var(--good)}
  .target.over{background:#fff7e6;border-color:#f2d39b} .target.over .gauge i{background:var(--warn)}
  .tgt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tgt-row input{width:70px;padding:4px 6px;font-weight:700;text-align:center}
  .tgt-row a{color:inherit}
  .warn{color:var(--warn)}
  button.clr{color:var(--muted);padding:3px 8px;line-height:1}
  button.clr:hover{color:var(--bad);border-color:var(--bad)}
  .clear-opts{display:flex;flex-direction:column;gap:8px}
  .clear-opts button{text-align:left;padding:10px 12px}
  .clear-opts button small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
  .booked{display:flex;align-items:center;gap:8px;background:#e8f1fb;border:1px solid #a9c8ea;color:#1d4f86;border-radius:8px;padding:6px 10px;font-size:13px}
  .booked b{font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:nowrap}
  .booked span{white-space:nowrap}
  .actions{display:grid !important;grid-template-columns:1fr auto auto}
  .actions button{white-space:nowrap;padding:8px 7px;font-size:14px;min-width:0}
  button.book{border-color:#2f6db5;color:#2f6db5;font-weight:600}
  button.book.done{background:#e8f1fb}
  table.sheet{width:100%;border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
  table.sheet td{white-space:normal;padding:6px 10px;vertical-align:middle}
  table.sheet td.lbl{color:var(--muted);width:190px;font-size:13px}
  table.sheet td.val{font-weight:600;word-break:break-word}
  table.sheet td:last-child{width:60px;text-align:right}
  table.sheet tr.sec td{background:#fff200;color:#111;font-weight:700;text-align:center;font-size:13px;padding:4px}
  .orderno{font:800 28px ui-monospace,Consolas,monospace;letter-spacing:1px;text-align:center;padding:14px;background:#f6f8fa;border:2px dashed #a9c8ea;border-radius:10px;margin:10px 0}
  .figs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;margin:0}
  .figs dt{color:var(--muted)} .figs dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .figs .big{font-size:17px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .actions .primary{flex:1}

  /* tables */
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td input{width:110px;padding:5px 7px}
  td input.wide{width:200px}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{display:flex;flex-direction:column}

  /* dialog */
  dialog{border:0;border-radius:14px;padding:0;width:min(860px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(20,26,34,.55)}
  .dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .dlg-h h2{margin:0;flex:1}
  .dlg-b{padding:16px 18px;max-height:72vh;overflow:auto}
  .dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:700px){.cols{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 14px 14px;margin:0}
  legend{font-weight:700;padding:0 6px}
  fieldset input,fieldset select{width:100%}
  .calc{margin-top:16px;background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .calc table td{border:0;padding:3px 6px}
  .calc .op{width:18px;color:var(--muted);font-weight:700}
  .calc tr.total td{border-top:2px solid var(--ink);font-weight:800;font-size:18px;padding-top:6px}
  .calc tr.sub td{border-top:1px solid #c5ccd4;font-weight:700}
  .predict{font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .note{background:#fff7e6;border:1px solid #f2d39b;color:#7a5410;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  .hidden{display:none !important}

  /* cloud sync */
  #sync{display:flex;align-items:center;gap:6px;font-size:13px;color:#c9d2dc}
  #sync i{width:9px;height:9px;border-radius:50%;background:#7d8b99;display:inline-block}
  #sync.ok i{background:#3ccf7a} #sync.busy i{background:#f0b429} #sync.off i{background:#f0b429} #sync.err i{background:#ff5c5c}
  #who{font-size:13px;color:#c9d2dc;display:flex;align-items:center;gap:8px}
  #who button{background:transparent;color:#c9d2dc;border-color:#3a4756;padding:4px 9px;font-size:13px}
  #login{position:fixed;inset:0;background:#1c2530;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
  #login .card{background:#fff;border-radius:14px;padding:24px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #login input{width:100%}
  #login .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2530;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  .addload{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 14px}
  .addload > div{display:flex;flex-direction:column}
  .addload label{margin-top:0}
  table.day td{vertical-align:middle;padding:6px 5px}
  table.day th{padding:8px 5px}
  .daynav{display:flex;gap:6px;align-items:center}
  table.day select{padding:5px 6px}
  .big-n{font-size:18px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e7eaee;color:#4a5563}
  .pill.in{background:#fff3e0;color:#8a4b08} .pill.done{background:#e9f7ef;color:var(--good)}
  .tag{display:inline-flex;gap:6px;align-items:center;background:#eef1f4;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
  .tag a{color:var(--muted);text-decoration:none}
  @media print{
    header,.actions,nav,.noprint,#toast{display:none !important}
    body{background:#fff} main{padding:0} .panel{box-shadow:none;padding:0}
    input,select{border:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none}
  }
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <div class="brand"><img src="favicon.svg" alt="" width="34" height="34">MRF Life</div>
    <nav id="nav">
      <button data-v="daysheet" class="on">Day Sheet</button>
      <button data-v="yard">Containers</button>
      <button data-v="containers">Tares &amp; Trucks</button>
      <button data-v="materials">Materials</button>
      <button data-v="history">History</button>
      <button data-v="backup">Backup</button>
    </nav>
    <div class="spacer"></div>
    <div id="sync" class="hidden" title="Sync status"><i></i><span></span></div>
    <div id="who" class="hidden"><span></span><button onclick="cloudSignOut()">Sign out</button></div>
    <button class="primary" onclick="openSwap()">Truck swap</button>
  </div>
</header>
<main id="main"></main>

<dialog id="dlg">
  <div class="dlg-h"><h2 id="dlg-title"></h2><button type="button" onclick="closeDlg()">✕</button></div>
  <div class="dlg-b" id="dlg-body"></div>
  <div class="dlg-f" id="dlg-foot"></div>
</dialog>
<div id="toast"></div>

<div id="login" class="hidden">
  <form class="card" onsubmit="cloudSignIn(event)">
    <div class="brand" style="color:var(--ink);margin-bottom:6px"><img src="favicon.svg" alt="" width="34" height="34">MRF Life</div>
    <p class="muted" style="margin:0 0 10px">Sign in to see and update the yard.</p>
    <label>Email</label><input id="li-email" type="email" autocomplete="username" required>
    <label>Password</label><input id="li-pass" type="password" autocomplete="current-password" required>
    <div class="err" id="li-err"></div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:6px">
      <a href="#" onclick="cloudReset();return false" class="muted">Forgot password?</a>
      <button class="primary" type="submit" id="li-btn">Sign in</button>
    </div>
  </form>
</div>

<!-- Firebase settings live in firebase-config.js. If it's missing or null the app runs on this device only. -->
<script src="firebase-config.js"></script>

<script>
/* =========================================================
   MRF Life — yard containers, bales, bookings and day sheet
   With firebase-config.js filled in, data is shared live through Firestore
   (one doc per bay / container / prefix / material / truck / load).
   Without it, data stays in this browser (localStorage).
   ========================================================= */
const KEY = 'containertracks:v1';
const BAY_COUNT = 6;

const newBay = n => ({ n, containerId:null, material:'OCC', bales:0, startedAt:null, log:[] });
const defaults = () => migrate({
  materials: [
    { code:'OCC',    name:'Cardboard',    baleKg:450, typical:48, color:'#9a6634' },
    { code:'MXP',    name:'Mixed Paper',  baleKg:500, typical:44, color:'#2f6db5' },
    { code:'ALI',    name:'Aluminium',    baleKg:300, typical:60, color:'#7d8b99' },
    { code:'HDPE C', name:'HDPE Colour',  baleKg:300, typical:50, color:'#1f9a68' },
    { code:'STEEL',  name:'Steel',        baleKg:450, typical:40, color:'#3d4652' },
  ],
  prefixes: [],            // {prefix, tare(kg), notes} — container number prefix -> tare
  containers: [],          // {id, tare|null (null = use prefix tare), notes, outSince}
  bays: Array.from({length:BAY_COUNT}, (_,i) => newBay(i+1)),
  trucks: {},              // rego -> {tare, updated}
  history: [],             // dispatched loads
  loads: [],               // day sheet: trucks loaded with bales (and planned ones)
  companies: [],           // remembered company names
  truckConfigs: null       // filled by migrate()
});

/* Linfox booking order numbers: prefix + zero-padded running number.
   'last' is the most recent number used; the next booking gets last + 1. */
const LINFOX_URL = 'https://portal.linfox.com/';
const ORDER_DEFAULTS = {
  'OCC':    { orderPrefix:'CRCMRF-OCC',  orderDigits:4, orderLast:109 },
  'MXP':    { orderPrefix:'CRCMRF-MXP',  orderDigits:4, orderLast:121 },
  'HDPE C': { orderPrefix:'CRCMRF-HDCO', orderDigits:3, orderLast:1 },
  'ALI':    { orderPrefix:'CRCMRF-MALU', orderDigits:3, orderLast:1 },
  'STEEL':  { orderPrefix:'',            orderDigits:3, orderLast:0 },
};
/* where each material is delivered — everything goes to Genuine Recycling except mixed paper (Visy) */
const GRG = 'GENUINE RECYCLING GROUP';
const DELIVERY_DEFAULTS = {
  'MXP': { deliveryTo:'VISY', deliveryInstr:'Booking required, Driver must quote - VWI 18811638' },
};
/* fixed details that go on every Linfox booking (editable on the Materials tab) */
const BOOKING_DEFAULTS = {
  serviceType: 'Door to Door',
  depot: 'CAIRNS',
  pickupLocation: 'CAIRNS REGIONAL COUNCIL',
  email: 'n.hoggan@cairns.qld.gov.au',
  phone: '0447934750',
  instrSuffix: '40ft empty required for exchange',
  product: '12.2M/40" Container General',
  quantity: 1,
  weightKg: 18000,
};
/* fill in order-number settings on materials saved before booking existed */
function migrate(st){
  st.materials.forEach(m => {
    if (m.orderPrefix === undefined) Object.assign(m, ORDER_DEFAULTS[m.code] || { orderPrefix:'', orderDigits:3, orderLast:0 });
    if (m.deliveryTo === undefined) Object.assign(m, DELIVERY_DEFAULTS[m.code] || { deliveryTo:GRG, deliveryInstr:'' });
  });
  st.settings = Object.assign({}, BOOKING_DEFAULTS, st.settings || {});
  st.loads = st.loads || []; st.companies = st.companies || []; st.forms = st.forms || {};
  if (!st.truckConfigs || !st.truckConfigs.length) st.truckConfigs = [
    { id:'b9', name:'9 axle B-double', maxGross:62500, maxBales:0 },
    { id:'b8', name:'8 axle B-double', maxGross:59000, maxBales:0 },
    { id:'s6', name:'6 axle semi',     maxGross:42500, maxBales:0 },
  ];
  return st;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v==null) return null; const x = parseFloat(String(v).replace(/[, ]/g,'')); return isNaN(x) ? null : x; };
/* everything is stored in kg but shown and typed in tonnes */
const kg  = n => (n==null || isNaN(n)) ? '—' : (n/1000).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' t';
const bt  = n => (n==null || isNaN(n)) ? '—' : (n/1000).toFixed(3) + ' t';   // bale weights need 3 decimals
const tv  = (n, d=2) => n==null ? '' : +(n/1000).toFixed(d);                  // input value in tonnes
const tn  = n => (n==null || isNaN(n)) ? '—' : (n/1000).toFixed(2) + ' t';
const signed = n => (n>0?'+':'−') + kg(Math.abs(n));
const normId = s => String(s||'').toUpperCase().replace(/\s+/g,'').trim();
const normRego = s => String(s||'').toUpperCase().replace(/\s+/g,'').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtDate = iso => iso ? new Date(iso).toLocaleString('en-AU',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- state ---------- */
let S;
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  S = migrate(Object.assign(defaults(), d || {}));
  for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
}
function save(){
  if (CLOUD && CLOUD.loaded) return cloudPush();
  try { localStorage.setItem(KEY, JSON.stringify(S)); autoSnapshot(); }
  catch(e){ toast('Could not save — browser storage is blocked'); }
}

const mat  = code => S.materials.find(m => m.code === code) || { code, name:code, baleKg:0, typical:0, color:'#888' };
const cont = id => S.containers.find(c => c.id === id);
const bayOf = id => S.bays.find(b => b.containerId === id);
/* bales to aim for: bay override, else the material's default target */
const targetOf = b => b.target ?? mat(b.material).typical ?? 0;
const nextOrderNo = m => m.orderPrefix ? m.orderPrefix + String((m.orderLast||0) + 1).padStart(m.orderDigits || 3, '0') : '';
/* if an order number fits a material's sequence, return its running number */
function orderSeq(m, no){
  if (!m.orderPrefix || !no) return null;
  no = String(no).toUpperCase().trim();
  if (!no.startsWith(m.orderPrefix)) return null;
  const n = no.slice(m.orderPrefix.length);
  return /^\d+$/.test(n) ? parseInt(n, 10) : null;
}
const estNet = b =>(b.bales||0) * (mat(b.material).baleKg||0);
const spares = (forBay) => S.containers.filter(c => !bayOf(c.id) && !S.bays.some(b => b.visit && b.visit.inId === c.id && b.n !== forBay));

/* ---------- prefix tares ----------
   Longest saved prefix that the container number starts with wins,
   so "AFDB" and "AFDBX" can both exist. */
const leadLetters = id => (normId(id).match(/^[A-Z]+/) || [''])[0].slice(0, 4);
function prefixFor(id){
  id = normId(id); if (!id) return null;
  let best = null;
  S.prefixes.forEach(p => { if (id.startsWith(p.prefix) && (!best || p.prefix.length > best.prefix.length)) best = p; });
  return best;
}
/* a container's own tare overrides; otherwise fall back to its prefix */
const tareOf = c => c ? (c.tare ?? prefixFor(c.id)?.tare ?? null) : null;
const tareSrc = c => c && c.tare == null && prefixFor(c.id) ? ` (prefix ${prefixFor(c.id).prefix})` : '';
/* weight inputs are tonnes (4.6); a big number like 4600 is taken as kg, just in case */
const toKg = v => { const x = num(v); if (x == null || x <= 0) return null; return x < 100 ? Math.round(x * 1000) : Math.round(x); };

/* shared "new container" fields: number + optional tare + prefix hint */
function newContFields(px){
  return `
    <label>Container number</label>

function prefixHint(px){
  const id = normId($(`#${px}-id`).value), typed = toKg($(`#${px}-tare`).value), el = $(`#${px}-hint`);
  if (!id){ el.innerHTML = ''; return; }

  else el.innerHTML = `<span class="neg">No saved tare for prefix ${esc(lead || id)} — enter the tare.</span>`;

/* read the fields → {id, ownTare, tare} or an error string */
function readNewCont(px){
  const id = normId($(`#${px}-id`).value), typed = toKg($(`#${px}-tare`).value);
  if (!id) return 'Enter a container number';
  const p = prefixFor(id);
  if (typed == null && !p) return `No tare for prefix ${leadLetters(id) || id} — enter the tare`;
  return { id, typed, tare: typed ?? p.tare, savePrefix: !p && typed != null && $(`#${px}-save`)?.checked ? leadLetters(id) : null };
}
/* commit: save prefix if asked, store container (own tare only when it differs from prefix) */
function commitNewCont(r){
  if (r.savePrefix && !S.prefixes.some(p => p.prefix === r.savePrefix)) S.prefixes.push({ prefix: r.savePrefix, tare: r.typed, notes:'' });
  const p = prefixFor(r.id);
  const own = (r.typed != null && !(p && p.tare === r.typed)) ? r.typed : null;
  let c = cont(r.id);
  if (c){ if (r.typed != null) c.tare = own; }
  else { c = { id:r.id, tare:own, notes:'' }; S.containers.push(c); }
  return c;
}

/* history maths — derived, so editing weigh-in / weigh-out later just works */
function hCalc(h){
  const truckTare = h.weighIn!=null ? h.weighIn - (h.inTare||0) : (h.truckTare ?? null);
  const predicted = truckTare!=null ? truckTare + h.outTare + h.estNet : null;
  const actualNet = (h.actualOut!=null && truckTare!=null) ? h.actualOut - truckTare - h.outTare : null;
  const perBale   = (actualNet!=null && h.bales>0) ? actualNet / h.bales : null;
  const diff      = (h.actualOut!=null && predicted!=null) ? h.actualOut - predicted : null;
  return { truckTare, predicted, actualNet, perBale, diff };
}
function learned(code){
  let net=0, bales=0, loads=0;
  S.history.forEach(h => {
    if (h.material !== code) return;
    const c = hCalc(h);
    if (c.actualNet!=null && h.bales>0){ net += c.actualNet; bales += h.bales; loads++; }
  });
  (S.loads||[]).forEach(l => {
    if (l.material !== code || l.weighOut == null || l.tare == null || !(l.bales > 0)) return;
    net += l.weighOut - l.tare; bales += l.bales; loads++;
  });
  return loads ? { avg: net/bales, loads } : null;
}

/* ---------- Genuine Recycling container weight declaration (PDF) ----------
   The signed form is uploaded once (Materials tab) and kept in the shared database,
   not in the public repo. Container number + tare are written onto its lines. */
const PDFLIB_URL = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
const isGenuine = m => /genuine/i.test(m.deliveryTo || '');
function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = PDFLIB_URL;
    sc.onload = () => ok(window.PDFLib); sc.onerror = () => fail(new Error('Could not load the PDF tool (check internet)'));
    document.head.appendChild(sc);
  });
}
const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function weightDeclaration(n){
  const b = bay(n), c = cont(b.containerId), form = S.forms?.genuine;
  if (!form) return toast('Upload the Genuine weight declaration PDF on the Materials tab first');
  const tare = tareOf(c);
  const win = window.open('', '_blank');           // open now so pop-up blockers allow it
  try {
    const { PDFDocument, StandardFonts, rgb, PDFName } = await loadPdfLib();
    const pdf = await PDFDocument.load(b64ToBytes(form.b64));
    /* drop the blue fill-in boxes: detach the form fields and their widgets */
    try { pdf.getForm().acroForm.dict.set(PDFName.of('Fields'), pdf.context.obj([])); } catch(e) {}
    pdf.getPages().forEach(pg => pg.node.delete(PDFName.of('Annots')));
    const page = pdf.getPages()[0], font = await pdf.embedFont(StandardFonts.Helvetica);
    const P = S.settings.declPos || {};
    /* same column, size and baseline as the printed details above (Genuine Recycling Group etc.) */
    page.drawText(fmtContNo(c.id), { x: P.contX ?? 229.7, y: P.contY ?? 398.6, size: 16, font, color: rgb(0,0,0) });
    if (tare != null) page.drawText(`${(tare/1000).toFixed(2)} t`, { x: P.tareX ?? 229.7, y: P.tareY ?? 342.9, size: 16, font, color: rgb(0,0,0) });
    const url = URL.createObjectURL(new Blob([await pdf.save()], { type: 'application/pdf' }));
    if (win) win.location.href = url; else window.open(url, '_blank');
  } catch(e){ if (win) win.close(); toast(e.message || 'Could not make the PDF'); console.error(e); }
}
function uploadForm(file){
  if (!file) return;
  if (file.size > 700000) return toast('That PDF is too big (keep it under 700 KB)');
  const r = new FileReader();
  r.onload = () => {
    const b64 = btoa(new Uint8Array(r.result).reduce((s, x) => s + String.fromCharCode(x), ''));
    S.forms = Object.assign({}, S.forms, { genuine: { b64, name: file.name, at: new Date().toISOString() } });
    save(); render(); toast('Weight declaration form saved');
  };
  r.readAsArrayBuffer(file);
}
function removeForm(){ if (!confirm('Remove the uploaded weight declaration form?')) return; S.forms = Object.assign({}, S.forms, { genuine: null }); save(); render(); }

function copyText(t, quiet){
  if (!t) return;
  const done = () => quiet || toast(`Copied ${t}`);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) {} ta.remove();
}

    <div class="clear-opts">
      <button onclick="doClear(${n},'bales')"><b>Reset bales to 0</b><small>Keeps the container in the bay. Also clears the booking and any saved weigh-in.</small></button>
      <button onclick="doClear(${n},'remove')"><b>Take the container out of the bay</b><small>Bay becomes empty. ${esc(c.id)} stays in the container register.</small></button>
      <button class="danger" onclick="doClear(${n},'delete')"><b>Remove and delete ${esc(c.id)}</b><small>Bay becomes empty and the container is deleted from the register. Past loads in History are kept.</small></button>
    </div>`,
    `<button class="primary" onclick="closeDlg()">Cancel</button>`);
}
function doClear(n, how){
  const b = bay(n), id = b.containerId;
  if (how === 'delete' && !confirm(`Delete ${id} completely?`)) return;
  b.bales = 0; b.startedAt = null; b.log = []; b.booking = null; b.visit = null; b.target = null;
  if (how !== 'bales') b.containerId = null;
  if (how === 'delete') S.containers = S.containers.filter(c => c.id !== id);
  save(); closeDlg(); render();
  toast(how === 'bales' ? `Bay ${n} reset to 0 bales` : `Bay ${n} cleared`);
}
function adj(n, d){
  const b = bay(n);
  const nb = Math.max(0, (b.bales||0) + d);
  if (nb === b.bales) return;
  if (CLOUD && CLOUD.loaded){
    /* increment, so taps from two devices at once both count */
    const F = CLOUD.F, upd = { bales: F.increment(nb - b.bales) };
    if (!b.startedAt && nb > 0) upd.startedAt = b.startedAt = new Date().toISOString();
    b.bales = nb;
    CLOUD.remote.bays.set(String(b.n), stable(clean(b)));
    F.updateDoc(F.doc(CLOUD.db, 'bays', String(b.n)), upd).catch(cloudErr);
    render(); return;
  }
  if (!b.startedAt && nb > 0) b.startedAt = new Date().toISOString();
  b.log.push({ t:new Date().toISOString(), d:nb - b.bales });
  b.bales = nb; save(); render();
}
function fillBay(n){
  const b = bay(n), tgt = targetOf(b);
  if (!tgt) return toast('Set a target for this bay first');
  adj(n, tgt - b.bales); toast(`Bay ${n} filled — ${tgt} bales`);
}
function setBales(n, v){
  const x = Math.max(0, Math.round(num(v) ?? 0));
  adj(n, x - bay(n).bales); render();
}
function setTarget(n, v){
  const b = bay(n), x = num(v);
  b.target = (String(v).trim()==='' || x==null || x<=0) ? null : Math.round(x);
  if (b.target === mat(b.material).typical) b.target = null;   // same as default → follow default
  save(); render();
}
function setMat(n, code){ bay(n).material = code; save(); render(); }

/* place / change container in a bay */
function openPlace(n){
  const b = bay(n), cur = cont(b.containerId);
  const opts = spares().map(c => `<option value="${esc(c.id)}">${esc(c.id)} — tare ${tn(tareOf(c))}</option>`).join('');
  openDlg(`Bay ${n} — ${cur ? 'change container' : 'place container'}`, `
    ${cur ? `<p>Currently: <b>${esc(cur.id)}</b> with ${b.bales} bales. Changing it here does <b>not</b> record a dispatch — use <b>Truck swap</b> for that. Use this to fix a mistake or move a container.</p>` : ''}
    <div class="cols">
      <div>
        <label>Container</label>
        <select id="pl-sel" onchange="$('#pl-new').classList.toggle('hidden', this.value!=='__new')" style="width:100%">
          ${cur ? '<option value="__none">— leave bay empty —</option>' : ''}
          ${opts}
          <option value="__new" ${opts?'':'selected'}>+ New container…</option>
        </select>
        <div id="pl-new" class="${opts?'hidden':''}">${newContFields('pl')}</div>
      </div>
      <div>
        <label>Material</label><select id="pl-mat" style="width:100%">${matOptions(b.material)}</select>
        <label>Bales already in it</label><input id="pl-bales" type="number" min="0" value="${cur ? b.bales : 0}" style="width:100%">
      </div>
    </div>`,
    `<button onclick="closeDlg()">Cancel</button><button class="primary" onclick="doPlace(${n})">Save</button>`);
}
function doPlace(n){
  const b = bay(n), sel = $('#pl-sel').value;
  let id = null;
  if (sel === '__new'){
    const r = readNewCont('pl');
    if (typeof r === 'string') return toast(r);
    if (bayOf(r.id) && bayOf(r.id).n !== +n) return toast(`${r.id} is already in Bay ${bayOf(r.id).n}`);
    id = commitNewCont(r).id;
  } else if (sel !== '__none') id = sel;
  if (id){ const c = cont(id); delete c.outSince; }
  b.containerId = id;
  b.material = $('#pl-mat').value;
  const bl = Math.max(0, Math.round(num($('#pl-bales').value) ?? 0));
  if (bl !== b.bales){ b.log.push({ t:new Date().toISOString(), d:bl - b.bales }); b.bales = bl; }
  if (!id){ b.bales = 0; b.startedAt = null; b.log = []; }
  else if (bl > 0 && !b.startedAt) b.startedAt = new Date().toISOString();
  save(); closeDlg(); render(); toast(`Bay ${n} updated`);
}

/* =========================================================
   TRUCK SWAP — weighed in, weighed out
   Truck tare        = weigh-in − tare of the empty it brought (0 if none)
   Net material out  = weigh-out − truck tare − tare of the full container
                     = weigh-out − weigh-in + empty tare − full tare
   The bale count × avg bale weight is only shown as a cross-check
   (and as an expected weigh-out while the truck is still on site).
   ========================================================= */
let SW = null;
function openSwap(n){
  const full = S.bays.filter(b => b.containerId);
  if (!full.length) return toast('No containers in the yard to swap out');
  n = n ?? (full.find(b => b.visit) || full[0]).n;
  const b = bay(n); if (!b.containerId) return openPlace(n);
  const c = cont(b.containerId), m = mat(b.material), v = b.visit;
  SW = { n };
  const spareOpts = spares(+n).map(x => `<option value="${esc(x.id)}">${esc(x.id)} — tare ${kg(tareOf(x))}</option>`).join('');
  const regos = Object.keys(S.trucks).sort().map(r => `<option value="${esc(r)}">`).join('');
  const noSpare = !spareOpts && !v;

  openDlg(v ? `Weigh out — Bay ${n}` : 'Truck swap', `
    <div class="row" style="margin-bottom:10px">
      <div><label>Bay being collected</label>
        <select onchange="openSwap(+this.value)">${full.map(x => `<option value="${x.n}" ${x.n===+n?'selected':''}>Bay ${x.n} — ${esc(x.containerId)} (${esc(x.material)}, ${x.bales} bales)${x.visit?' · truck on site':''}</option>`).join('')}</select>
      </div>
    </div>
    <div class="cols">
      <fieldset>
        <legend>Truck coming in</legend>
        <label>Truck rego</label>
        <input id="sw-rego" list="sw-regos" placeholder="e.g. 123ABC" oninput="swCalc()" autocomplete="off" value="${esc(v?.rego||'')}">
        <datalist id="sw-regos">${regos}</datalist>
        <label>Empty container it brought</label>
        <select id="sw-in" onchange="$('#sw-new').classList.toggle('hidden', this.value!=='__new'); swCalc()">
          <option value="">— none, truck came in bare —</option>
          ${spareOpts}
          <option value="__new" ${noSpare?'selected':''}>+ New container…</option>
        </select>
        <div id="sw-new" class="${noSpare?'':'hidden'}">${newContFields('sw-new')}</div>
        <label>Material to load in the empty</label>
        <select id="sw-mat">${matOptions(v?.nextMat || b.material)}</select>
      </fieldset>
      <fieldset>
        <legend>Leaving — full</legend>
        ${b.booking ? `<div class="booked" style="margin-bottom:6px">🚚 <b>${esc(b.booking.orderNo||'')}</b></div>` : '<div class="note" style="margin:0 0 6px">Not booked yet</div>'}
        <div class="cid">${esc(c.id)}</div>
        <div class="muted">Tare ${tareOf(c)!=null ? kg(tareOf(c)) + tareSrc(c) : '<span class="neg">unknown</span>'} · <span class="chip" style="--mc:${esc(m.color)}">${esc(m.code)}</span></div>
        <label>Bales in container</label>
        <input id="sw-bales" type="number" min="0" inputmode="numeric" value="${b.bales}" oninput="swCalc()">
        <div id="sw-tgt" class="muted" style="margin-top:6px"></div>
      </fieldset>
    </div>
    <fieldset style="margin-top:14px">
      <legend>Weighbridge</legend>
      <div class="cols">
        <div><label>1st weigh — truck in${v ? ` <span class="muted">(saved ${fmtDate(v.at)})</span>` : ''} (t)</label>
          <input id="sw-win" type="number" step="any" inputmode="decimal" oninput="swCalc()" placeholder="e.g. 18.60" value="${v?.weighIn!=null ? tv(v.weighIn) : ''}" style="font-size:20px;font-weight:700"></div>
        <div><label>2nd weigh — truck out, loaded (t)</label>
          <input id="sw-out" type="number" step="any" inputmode="decimal" oninput="swCalc()" placeholder="e.g. 38.50" style="font-size:20px;font-weight:700"></div>
      </div>
    </fieldset>
    <div class="calc" id="sw-calc"></div>`,
    `<button onclick="closeDlg()" style="margin-right:auto">Cancel</button>
     <button id="sw-later" onclick="saveVisit()">Save weigh-in, weigh out later</button>
     <button class="primary" onclick="doSwap()">Complete swap</button>`);
  if (v){ const sel = $('#sw-in'); sel.value = v.inId || ''; if (sel.value !== (v.inId || '')) sel.value = ''; }
  swCalc();
}

function swRead(){
  const b = bay(SW.n), c = cont(b.containerId), m = mat(b.material);
  const bales = Math.max(0, Math.round(num($('#sw-bales').value) ?? 0));
  const est = bales * m.baleKg;
  const sel = $('#sw-in').value;
  let inId = null, inTare = 0, isNew = false, newRec = null;
  if (sel === '__new'){
    isNew = true; newRec = readNewCont('sw-new');
    inId = normId($('#sw-new-id').value);
    inTare = typeof newRec === 'string' ? null : newRec.tare;
  }
  else if (sel){ inId = sel; inTare = tareOf(cont(sel)); }
  const outTare = tareOf(c);
  const rego = normRego($('#sw-rego').value);
  const weighIn = toKg($('#sw-win').value), weighOut = toKg($('#sw-out').value);
  let truckTare = null, src = '';
  if (weighIn!=null && inTare!=null){ truckTare = weighIn - inTare; src = 'in'; }
  else if (rego && S.trucks[rego]){ truckTare = S.trucks[rego].tare; src = 'known'; }
  const expectedOut = (truckTare!=null && outTare!=null) ? truckTare + outTare + est : null;
  const net = (weighOut!=null && truckTare!=null && outTare!=null) ? weighOut - truckTare - outTare : null;
  return { b, c, m, bales, est, inId, inTare, isNew, newRec, outTare, rego, weighIn, weighOut, truckTare, src, expectedOut, net };
}

function swCalc(){
  const r = swRead();
  const tgt = targetOf(r.b), d = r.bales - tgt;
  $('#sw-tgt').innerHTML = !tgt ? 'No target set' : d < 0 ? `<span class="warn">${-d} bales short of the ${tgt} target</span>` : d === 0 ? `<span class="pos">✓ On target (${tgt})</span>` : `<span class="warn">${d} over the ${tgt} target</span>`;
  $('#sw-later').classList.toggle('hidden', r.weighOut != null);

  const row = (op, l, v, cls='') => `<tr class="${cls}"><td class="op">${op}</td><td>${l}</td><td class="n">${v}</td></tr>`;
  const outTareRow = row('−', `Full container tare — ${esc(r.c.id)}${esc(tareSrc(r.c))}`, kg(r.outTare));
  let html = '';

  if (r.net != null){
    /* both weighings in: this is the real figure */
    let rows = row('', '2nd weigh — truck out, loaded', kg(r.weighOut));
    if (r.src === 'in'){
      rows += row('−', '1st weigh — truck in', kg(r.weighIn));
      if (r.inId) rows += row('+', `Empty container tare it brought — ${esc(r.inId)}`, kg(r.inTare));
    } else {
      rows += row('−', `Truck tare — last known for ${esc(r.rego)} <span class="muted">(no 1st weigh entered)</span>`, kg(r.truckTare));
    }
    rows += outTareRow;
    const per = r.bales ? r.net / r.bales : null, diff = r.net - r.est;
    html = `
      <div class="row" style="justify-content:space-between;align-items:center">
        <table style="width:auto">${rows}${row('=', 'Net weight of material', kg(r.net), 'total')}</table>
        <div style="text-align:right"><div class="muted">Net ${esc(r.m.code)} going out</div><div class="predict">${kg(r.net)}</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Cross-check: ${r.bales} bales × ${bt(r.m.baleKg)} = ${kg(r.est)} estimated
        (<span class="${Math.abs(diff)>1000?'neg':'pos'}">${signed(diff)}</span>)${per!=null ? ` · actual ${bt(per)} per bale` : ''}</div>
      ${r.net <= 0 ? '<div class="note">Net weight is zero or negative — check the weighings and tares.</div>' : ''}`;
  } else {
    /* still waiting for the 2nd weigh */
    let rows = '';
    if (r.src === 'in'){
      rows += row('', '1st weigh — truck in', kg(r.weighIn));
      rows += row('−', `Empty container tare${r.inId ? ` — ${esc(r.inId)}` : ' (came in bare)'}`, kg(r.inTare));
      rows += row('=', 'Truck tare', kg(r.truckTare), 'sub');
    } else if (r.src === 'known'){
      rows += row('', `Truck tare — last known for ${esc(r.rego)} (${fmtDate(S.trucks[r.rego].updated)})`, kg(r.truckTare), 'sub');
    } else {
      rows += row('', 'Truck tare', '<span class="muted">enter the 1st weigh</span>', 'sub');
    }
    rows += row('+', `Full container tare — ${esc(r.c.id)}${esc(tareSrc(r.c))}`, kg(r.outTare));
    rows += row('+', `Bale estimate (${r.bales} × ${bt(r.m.baleKg)})`, kg(r.est));
    html = `
      <div class="row" style="justify-content:space-between;align-items:center">
        <table style="width:auto">${rows}${row('≈', 'Expected 2nd weigh', kg(r.expectedOut), 'total')}</table>
        <div style="text-align:right"><div class="muted">Waiting for 2nd weigh<br>expect about</div><div class="predict" style="color:var(--muted)">${r.expectedOut!=null ? kg(r.expectedOut) : '—'}</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Enter the 2nd weigh to get the actual net weight.</div>`;
  }
  if (r.weighIn!=null && r.inTare!=null && r.weighIn < r.inTare) html += '<div class="note">1st weigh is less than the empty container tare — check the numbers.</div>';
  if (r.outTare == null) html += `<div class="note">No tare for ${esc(r.c.id)} — add its prefix tare on the Tares & Trucks tab.</div>`;
  $('#sw-calc').innerHTML = html;
}

/* truck weighed in but not out yet: park it on the bay */
function saveVisit(){
  const r = swRead();
  if (r.weighIn == null) return toast('Enter the 1st weigh');
  if (r.isNew){
    if (typeof r.newRec === 'string') return toast(r.newRec);
    if (bayOf(r.inId)) return toast(`${r.inId} is already in Bay ${bayOf(r.inId).n}`);
    commitNewCont(r.newRec);
  }
  r.b.visit = { rego: r.rego, inId: r.inId, weighIn: r.weighIn, nextMat: $('#sw-mat').value, at: new Date().toISOString() };
  r.b.bales = r.bales;
  if (r.rego && r.truckTare!=null) S.trucks[r.rego] = { tare: r.truckTare, updated: r.b.visit.at };
  save(); closeDlg(); render(); toast(`Weigh-in saved — Bay ${r.b.n} waiting for weigh-out`);
}
function cancelVisit(n){ if (!confirm('Clear the saved weigh-in for this bay?')) return; bay(n).visit = null; save(); render(); }

function doSwap(){
  const r = swRead();
  if (r.isNew){
    if (typeof r.newRec === 'string') return toast(r.newRec);
    if (bayOf(r.inId)) return toast(`${r.inId} is already in Bay ${bayOf(r.inId).n}`);
    if (r.inId === r.c.id) return toast('Incoming container is the same as the outgoing one');
  }
  if (r.outTare == null) return toast(`No tare for ${r.c.id} — add its prefix tare on the Tares & Trucks tab first`);
  if (r.weighOut == null && !confirm('No 2nd weigh entered, so there is no actual net weight yet.\n\nComplete the swap anyway? You can add the weigh-out later in History.')) return;
  const now = new Date().toISOString();
  S.history.unshift({
    id: uid(), date: now, bay: r.b.n, rego: r.rego || '',
    orderNo: r.b.booking?.orderNo || '',
    outId: r.c.id, outTare: r.outTare, material: r.m.code, bales: r.bales, target: targetOf(r.b) || null, baleKg: r.m.baleKg, estNet: r.est,
    inId: r.inId, inTare: r.inTare || 0, weighIn: r.weighIn, weighInAt: r.b.visit?.at || now,
    truckTare: r.truckTare, predicted: r.expectedOut, actualOut: r.weighOut, startedAt: r.b.startedAt
  });
  if (r.rego && r.weighIn!=null && r.truckTare!=null) S.trucks[r.rego] = { tare: r.truckTare, updated: now };
  r.c.outSince = now;
  if (r.inId){
    const ic = r.isNew ? commitNewCont(r.newRec) : cont(r.inId);
    delete ic.outSince;
  }
  const b = r.b;
  b.containerId = r.inId; b.material = $('#sw-mat').value; b.bales = 0; b.startedAt = null; b.log = []; b.booking = null; b.visit = null;
  save(); closeDlg(); render();
  toast(r.net != null ? `${r.c.id} out · net ${kg(r.net)}` : `${r.c.id} dispatched — add the weigh-out in History`);
}

/* =========================================================
   DAY SHEET — B-doubles etc. loaded with bales
   Max payload = configuration's max gross − truck tare
   Max bales   = max payload ÷ avg bale weight (capped by the config's bale space, if set)
   ========================================================= */
const ymd = d => { const x = d ? new Date(d) : new Date(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDay = s => new Date(s + 'T12:00:00').toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
const cfgOf = id => S.truckConfigs.find(c => c.id === id) || S.truckConfigs[0];
let DAY = ymd();

function loadCalc(l){
  const m = mat(l.material), cfg = cfgOf(l.config);
  const payload = (cfg && l.tare != null) ? cfg.maxGross - l.tare : null;
  let maxBales = (payload != null && m.baleKg) ? Math.floor(payload / m.baleKg) : null;
  if (maxBales != null && cfg.maxBales) maxBales = Math.min(maxBales, cfg.maxBales);
  if (maxBales != null) maxBales = Math.max(0, maxBales);
  const estGross = (l.tare != null && l.bales) ? l.tare + l.bales * m.baleKg : null;
  const net = (l.weighOut != null && l.tare != null) ? l.weighOut - l.tare : null;
  const status = l.weighOut != null ? 'done' : l.tare != null ? 'in' : 'planned';
  return { m, cfg, payload, maxBales, estGross, net, perBale: net != null && l.bales ? net / l.bales : null, status };
}
function rememberCompany(name){
  name = String(name||'').trim(); if (!name) return;
  if (!S.companies.some(c => c.toLowerCase() === name.toLowerCase())) S.companies.push(name), S.companies.sort((a,b) => a.localeCompare(b));
}

  const matOpts = sel => S.materials.map(m => `<option value="${esc(m.code)}" ${m.code===sel?'selected':''}>${esc(m.code)}</option>`).join('');
  const totNet = day.reduce((s,l) => s + (loadCalc(l).net || 0), 0);
  const pill = st => ({ planned:'<span class="pill">Expected</span>', in:'<span class="pill in">On site</span>', done:'<span class="pill done">Done ✓</span>' })[st];

  $('#main').innerHTML = `
    <datalist id="dl-companies">${S.companies.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="dl-regos">${Object.keys(S.trucks).sort().map(r => `<option value="${esc(r)}">`).join('')}</datalist>
    <div class="panel">
      <div class="row noprint" style="justify-content:space-between;align-items:center;margin-bottom:6px">
        <span class="daynav">
          <button onclick="DAY=addDays(DAY,-1);render()">‹</button>
          <input type="date" value="${DAY}" onchange="DAY=this.value||ymd();render()">
          <button onclick="DAY=addDays(DAY,1);render()">›</button>
          ${DAY !== today ? `<button onclick="DAY=ymd();render()">Today</button>` : ''}
        </span>
        <button onclick="window.print()">Print day sheet</button>
      </div>
      <h2>Day sheet — ${fmtDay(DAY)}${DAY===today ? ' <span class="muted">(today)</span>' : DAY > today ? ' <span class="muted">(planned)</span>' : ''}</h2>

      <div class="addload noprint">
        <div><label>Date</label><input id="dl-date" type="date" value="${DAY}" oninput="dlDateLabel()" style="width:150px"></div>
        <div><label>Company</label><input id="dl-co" list="dl-companies" placeholder="e.g. Visy" style="width:180px"></div>
        <div><label>Commodity</label><select id="dl-mat">${matOpts('OCC')}</select></div>
        <div><label>Truck</label><select id="dl-cfg">${cfgOpts(S.truckConfigs[0]?.id)}</select></div>
        <div><label>Rego</label><input id="dl-rego" list="dl-regos" placeholder="if here" style="width:110px" oninput="dlRegoFill()"></div>
        <div><label>Tare (t)</label><input id="dl-tare" type="number" step="any" placeholder="if here" style="width:90px"></div>
        <div><label>Notes</label><input id="dl-notes" style="width:160px"></div>
        <div><label>&nbsp;</label><button class="primary" id="dl-add" onclick="addLoad()">${addLabel(DAY)}</button></div>
      </div>

      <div class="tbl-wrap"><table class="day">
        <tr><th>#</th><th>Company</th><th>Commodity</th><th>Truck</th><th>Rego</th><th class="n">Tare (t)</th>
<th class="n">Can carry</th><th class="n">Max bales</th><th class="n">Bales loaded</th><th class="n">Est. gross</th>

const addLabel = d => d === ymd() ? 'Add to today' : 'Add to ' + fmtDay(d).replace(/ \d{4}$/, '');
function dlDateLabel(){ $('#dl-add').textContent = addLabel($('#dl-date').value || DAY); }
/* containers sitting in the yard that still need bales (empty first) */
function toFillPanel(){
  const list = S.bays.filter(b => b.containerId && !(targetOf(b) && b.bales >= targetOf(b)))
    .sort((a, b) => (a.bales - b.bales) || (a.n - b.n));
  const rows = list.map(b => {
    const m = mat(b.material), tgt = targetOf(b), left = tgt ? tgt - b.bales : null;
    return `<tr>
      <td><b>Bay ${b.n}</b></td>
      <td class="cid" style="font-size:14px">${esc(fmtContNo(b.containerId))}</td>
      <td><span class="chip" style="--mc:${esc(m.color)}">${esc(m.code)}</span></td>
      <td>${b.bales === 0 ? '<span class="pill">Empty</span>' : `<span class="pill in">Part filled</span>`}</td>
      <td class="n">${b.bales}${tgt ? ` / ${tgt}` : ''}</td>
      <td class="n"><b>${left != null ? left : '—'}</b></td>
      <td class="n">${left != null ? kg(left * m.baleKg) : '—'}</td>
      <td>${b.booking ? `🚚 ${esc(b.booking.orderNo||'booked')}` : ''}</td>
    </tr>`;
  }).join('');
  const totLeft = list.reduce((s, b) => s + Math.max(0, (targetOf(b) || 0) - b.bales), 0);
  return `<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2 style="margin:0">Containers to fill</h2>
      <button class="noprint" onclick="document.querySelector('#nav [data-v=yard]').click()">Go to Containers</button>
    </div>
    ${list.length ? `<div class="tbl-wrap"><table>
      <tr><th>Bay</th><th>Container</th><th>Commodity</th><th>State</th><th class="n">Bales / target</th><th class="n">Bales to go</th><th class="n">≈ Tonnes to go</th><th>Booking</th></tr>
      ${rows}
      <tr><td colspan="5" class="n"><b>Total</b></td><td class="n"><b>${totLeft}</b></td><td colspan="2"></td></tr>
    </table></div>`
    : `<p class="muted">${S.bays.some(b => b.containerId) ? 'Every container in the yard is at its target. ✓' : 'No containers in the yard.'}</p>`}
  </div>`;
}
function dlRegoFill(){
  const r = normRego($('#dl-rego').value), t = S.trucks[r];
  if (t){ if (!$('#dl-tare').value) $('#dl-tare').value = tv(t.tare); if (t.config && cfgOf(t.config)) $('#dl-cfg').value = t.config; }
}
function addLoad(){
  const company = $('#dl-co').value.trim();
  if (!company) return toast('Enter the company');
  const rego = normRego($('#dl-rego').value), tare = toKg($('#dl-tare').value);
  const date = $('#dl-date').value || DAY;
  const l = { id: uid(), date, company, material: $('#dl-mat').value, config: $('#dl-cfg').value,
              rego, tare, bales: null, weighOut: null, notes: $('#dl-notes').value.trim(), order: Date.now() };
  S.loads.push(l); rememberCompany(company); rememberTruck(l);
  save(); render(); toast(`${company} added to ${fmtDay(date)}${date !== DAY ? ' (see Upcoming loads)' : ''}`);
  setTimeout(() => { if ($('#dl-date')) { $('#dl-date').value = date; dlDateLabel(); } $('#dl-co')?.focus(); }, 0);
}
function rememberTruck(l){ if (l.rego && l.tare != null) S.trucks[l.rego] = { tare: l.tare, updated: new Date().toISOString(), config: l.config }; }
function setLoad(id, f, v){
  const l = S.loads.find(x => x.id === id); if (!l) return;
  if (f === 'tare' || f === 'weighOut') l[f] = String(v).trim() === '' ? null : toKg(v);
  else if (f === 'bales') l[f] = String(v).trim() === '' ? null : Math.max(0, Math.round(num(v) ?? 0));
  else if (f === 'rego'){ l.rego = normRego(v); const t = S.trucks[l.rego]; if (t && l.tare == null){ l.tare = t.tare; if (t.config) l.config = t.config; } }
  else { l[f] = String(v).trim(); if (f === 'company') rememberCompany(l.company); }
  if (f === 'tare' || f === 'rego' || f === 'config') rememberTruck(l);
  save(); render();
}
function editLoad(id){
  const l = S.loads.find(x => x.id === id);
  openDlg(`${l.company} — ${fmtDay(l.date)}`, `
    <div class="cols">
      <div><label>Date</label><input id="el-date" type="date" value="${l.date}" style="width:100%"></div>
      <div><label>Notes</label><input id="el-notes" value="${esc(l.notes||'')}" style="width:100%"></div>
    </div>
    <p class="muted">Change the date to move this load to another day.</p>`,
    `<button onclick="closeDlg()">Cancel</button><button class="primary" onclick="saveLoadMore('${id}')">Save</button>`);
}
function saveLoadMore(id){
  const l = S.loads.find(x => x.id === id);
  l.date = $('#el-date').value || l.date; l.notes = $('#el-notes').value.trim();
  save(); closeDlg(); render(); toast('Load updated');
}
function delLoad(id){
  const l = S.loads.find(x => x.id === id);
  if (!confirm(`Delete ${l.company} (${fmtDay(l.date)})?`)) return;
  S.loads = S.loads.filter(x => x.id !== id); save(); render();
}
function setCfg(i, f, v){
  const c = S.truckConfigs[i];
  if (f === 'maxGross'){ const x = toKg(v); if (x == null) return toast('Invalid weight'); c.maxGross = x; }
  else if (f === 'maxBales') c.maxBales = Math.max(0, Math.round(num(v) ?? 0));
  else c.name = String(v).trim() || c.name;
  save(); render();
}
function addCfg(){
  const name = $('#cf-name').value.trim(), mx = toKg($('#cf-max').value);
  if (!name || mx == null) return toast('Enter a name and max gross');
  S.truckConfigs.push({ id: uid(), name, maxGross: mx, maxBales: 0 }); save(); render();
}
function delCfg(i){ if (!confirm(`Delete ${S.truckConfigs[i].name}?`)) return; S.truckConfigs.splice(i,1); save(); render(); }
function delCompany(name){ S.companies = S.companies.filter(c => c !== name); save(); render(); }

function renderContainers(){
  const list = [...S.containers].sort((a,b) => (bayOf(a.id)?.n ?? 99) - (bayOf(b.id)?.n ?? 99) || a.id.localeCompare(b.id));
  const trucks = Object.entries(S.trucks).sort((a,b) => a[0].localeCompare(b[0]));
  const pfx = [...S.prefixes].sort((a,b) => a.prefix.localeCompare(b.prefix));
  $('#main').innerHTML = `
    <div class="panel">
      <h2>Tare by prefix</h2>
      <p class="muted">Store one tare per container prefix (e.g. <b>AFDB → 4.60 t</b>). Any container whose number starts with that prefix uses this tare automatically, unless it has its own tare in the register below.
      All weights are in tonnes.</p>
      <div class="row" style="margin-bottom:14px">
        <div><label>Prefix</label><input id="p-pre" placeholder="AFDB" style="width:110px;text-transform:uppercase" onkeydown="if(event.key==='Enter')$('#p-tare').focus()"></div>
        <div><label>Tare (t)</label><input id="p-tare" type="number" step="any" inputmode="decimal" placeholder="4.60" style="width:120px" onkeydown="if(event.key==='Enter')addPrefix()"></div>
        <div><label>Notes</label><input id="p-notes" placeholder="optional, e.g. 40ft high-side" style="width:220px"></div>
        <div><button class="primary" onclick="addPrefix()">Add prefix</button></div>
      </div>
      <div class="tbl-wrap"><table>
        <tr><th>Prefix</th><th class="n">Tare (t)</th><th class="n">Containers using it</th><th>Notes</th><th></th></tr>
        ${pfx.length ? pfx.map(p => { const used = S.containers.filter(c => c.tare==null && prefixFor(c.id)===p).length; return `<tr>
          <td><b class="cid" style="font-size:15px">${esc(p.prefix)}</b></td>
          <td class="n"><input type="number" step="0.01" value="${(p.tare/1000).toFixed(2)}" onchange="setPrefixTare('${esc(p.prefix)}',this.value)" style="width:90px"></td>
          <td class="n">${used}</td>
          <td><input class="wide" value="${esc(p.notes||'')}" onchange="setPrefixNotes('${esc(p.prefix)}',this.value)"></td>
          <td><button class="small danger" onclick="delPrefix('${esc(p.prefix)}')">Delete</button></td>
        </tr>`; }).join('') : `<tr><td colspan="6" class="muted">No prefixes yet. Add one above, or tick "save as prefix tare" when entering a new container.</td></tr>`}
      </table></div>
    </div>
    <div class="panel">
      <h2>Container register</h2>
      <p class="muted">Containers are added here automatically when they come into a bay. Leave a container's tare blank to use its prefix tare, or type one in to override it for that container only.</p>
      <div class="row" style="margin-bottom:14px;align-items:flex-start">
        <div style="width:260px">${newContFields('c')}</div>
        <div><label>Notes</label><input id="c-notes" placeholder="optional" style="width:220px"></div>
        <div style="padding-top:26px"><button class="primary" onclick="addContainer()">Add container</button></div>
      </div>
      <div class="tbl-wrap"><table>
        <tr><th>Container</th><th class="n">Own tare (t)</th><th class="n">Tare used</th><th>Where</th><th>Notes</th><th></th></tr>
        ${list.length ? list.map(c => `<tr>
          <td><b class="cid" style="font-size:15px">${esc(c.id)}</b></td>
          <td class="n"><input type="number" step="0.01" value="${tv(c.tare)}" placeholder="${prefixFor(c.id) ? 'prefix' : 'needed'}" onchange="setTare('${esc(c.id)}',this.value)"></td>
          <td class="n">${tareOf(c)!=null ? `${kg(tareOf(c))}<div class="muted">${c.tare!=null ? 'own tare' : 'prefix ' + esc(prefixFor(c.id).prefix)}</div>` : '<span class="neg">unknown</span>'}</td>
          <td>${esc(where(c))}</td>
          <td><input class="wide" value="${esc(c.notes||'')}" onchange="setNotes('${esc(c.id)}',this.value)"></td>
          <td><button class="small danger" onclick="delContainer('${esc(c.id)}')">Delete</button></td>
        </tr>`).join('') : `<tr><td colspan="6" class="muted">No containers yet — add them here or straight from a bay.</td></tr>`}
      </table></div>
    </div>
    <div class="panel">
      <h2>Known trucks</h2>
      <p class="muted">Each truck's tare is saved from its last weigh-in (weigh-in − empty container tare). If a truck comes back, picking its rego gives a prediction before it even hits the bridge.</p>

        <tr><th>Rego</th><th class="n">Tare (t)</th><th>Last updated</th><th></th></tr>

function addContainer(){
  const r = readNewCont('c');
  if (typeof r === 'string') return toast(r);
  if (cont(r.id)) return toast(`${r.id} is already in the register`);
  commitNewCont(r).notes = $('#c-notes').value.trim();
  save(); render(); toast(`${r.id} added`);
}
function setTare(id, v){
  const c = cont(id);
  if (String(v).trim() === ''){
    if (!prefixFor(id)) { render(); return toast(`No prefix tare for ${id} — it needs its own tare`); }
    c.tare = null; save(); render(); return toast(`${id} now uses prefix tare`);
  }
  const t = toKg(v); if (t==null) return toast('Invalid tare');
  c.tare = t; save(); render(); toast(`${id} tare updated`);
}
function addPrefix(){
  const pre = normId($('#p-pre').value).replace(/[^A-Z0-9]/g,''), t = toKg($('#p-tare').value);
  if (!pre) return toast('Enter a prefix');
  if (t == null) return toast('Enter the tare');
  if (S.prefixes.some(p => p.prefix === pre)) return toast(`${pre} already exists — edit it in the table`);
  S.prefixes.push({ prefix:pre, tare:t, notes:$('#p-notes').value.trim() });
  save(); render(); toast(`${pre} → ${tn(t)}`); $('#p-pre').focus();
}
function setPrefixTare(pre, v){ const t = toKg(v); if (t==null) return toast('Invalid tare'); S.prefixes.find(p => p.prefix===pre).tare = t; save(); render(); toast(`${pre} → ${tn(t)}`); }
function setPrefixNotes(pre, v){ S.prefixes.find(p => p.prefix===pre).notes = v.trim(); save(); }
function delPrefix(pre){
  const users = S.containers.filter(c => c.tare==null && prefixFor(c.id)?.prefix===pre).length;
  if (!confirm(`Delete prefix ${pre}?${users ? ` ${users} container(s) use it and will have no tare until you set one.` : ''}`)) return;
  S.prefixes = S.prefixes.filter(p => p.prefix !== pre); save(); render();
}
function setNotes(id, v){ cont(id).notes = v.trim(); save(); }
function delContainer(id){
  const b = bayOf(id);
  if (!confirm(`Delete ${id} from the register?${b ? `\n\nIt's in Bay ${b.n} with ${b.bales} bales — the bay will be emptied.` : ''}\n\nPast loads in History are kept.`)) return;
  if (b){ b.containerId = null; b.bales = 0; b.startedAt = null; b.log = []; b.booking = null; b.visit = null; }
  S.containers = S.containers.filter(c => c.id !== id); save(); render(); toast(`${id} deleted`);
}
function setTruck(r, v){ const t = toKg(v); if (t==null) return toast('Invalid tare'); S.trucks[r] = { tare:t, updated:new Date().toISOString() }; save(); render(); }
function delTruck(r){ delete S.trucks[r]; save(); render(); }

function restore(file){

/* =========================================================
   FIREBASE SYNC
   ========================================================= */
const COLS = ['bays','containers','prefixes','materials','trucks','history','settings','loads'];
let CLOUD = null;          // set once firebase-config.js + SDK are loaded
let pendingRender = false;

const enc = s => encodeURIComponent(String(s)).replace(/\./g, '%2E');
const clean = o => JSON.parse(JSON.stringify(o));               // drops undefined (Firestore rejects it)
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);

function toDocs(st){
  const out = {}; COLS.forEach(c => out[c] = new Map());
  st.bays.forEach(b => out.bays.set(String(b.n), { ...b, log: [] }));
  st.containers.forEach(c => out.containers.set(enc(c.id), c));
  st.prefixes.forEach(p => out.prefixes.set(enc(p.prefix), p));
  st.materials.forEach((m, i) => out.materials.set(enc(m.code), { ...m, _i: i }));
  Object.entries(st.trucks).forEach(([r, t]) => out.trucks.set(enc(r), { rego: r, ...t }));
  st.history.forEach(h => out.history.set(h.id, h));
  out.settings.set('booking', st.settings);
  out.settings.set('companies', { names: st.companies });
  out.settings.set('truckConfigs', { list: st.truckConfigs });
  out.settings.set('forms', { genuine: st.forms?.genuine || null });
  (st.loads||[]).forEach(l => out.loads.set(l.id, l));
  return out;
}
function fromRemote(){
  const vals = c => [...CLOUD.remote[c].values()].map(j => JSON.parse(j));
  const s = defaults(), bays = vals('bays');
  s.bays = s.bays.map(b => Object.assign(newBay(b.n), bays.find(x => x.n === b.n) || {}));
  s.containers = vals('containers');
  s.prefixes = vals('prefixes');
  const mats = vals('materials').sort((a, b) => (a._i ?? 0) - (b._i ?? 0)).map(({ _i, ...m }) => m);
  if (mats.length) s.materials = mats;
  migrate(s);
  s.trucks = {}; vals('trucks').forEach(({ rego, ...t }) => s.trucks[rego] = t);
  s.history = vals('history').sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const sdoc = id => { const j = CLOUD.remote.settings.get(id); return j ? JSON.parse(j) : null; };
  s.settings = Object.assign({}, BOOKING_DEFAULTS, sdoc('booking') || {});
  s.companies = sdoc('companies')?.names || [];
  const cfgs = sdoc('truckConfigs')?.list; if (cfgs && cfgs.length) s.truckConfigs = cfgs;
  s.loads = vals('loads');
  s.forms = { genuine: sdoc('forms')?.genuine || null };
  return s;
}

/* write only the docs that changed since the last snapshot */
function cloudPush(){
  const L = toDocs(S), R = CLOUD.remote, F = CLOUD.F, ops = [];
  COLS.forEach(c => {
    if (CLOUD.blocked && CLOUD.blocked.has(c)) return;
    L[c].forEach((obj, id) => { const j = stable(clean(obj)); if (R[c].get(id) !== j) ops.push(['set', c, id, j]); });
    R[c].forEach((_, id) => { if (!L[c].has(id)) ops.push(['del', c, id]); });
  });
  for (let i = 0; i < ops.length; i += 400){
    const batch = F.writeBatch(CLOUD.db);
    ops.slice(i, i + 400).forEach(([t, c, id, j]) => {
      const ref = F.doc(CLOUD.db, c, id);
      t === 'set' ? batch.set(ref, JSON.parse(j)) : batch.delete(ref);
    });
    batch.commit().catch(cloudErr);     // not awaited: offline writes queue and sync later
  }
  ops.forEach(([t, c, id, j]) => t === 'set' ? R[c].set(id, j) : R[c].delete(id));
  autoSnapshot(); syncStatus();
}
function cloudErr(e){
  console.error(e);
  const msg = e && e.code === 'permission-denied' ? 'No permission — check the Firestore rules' : 'Save failed — ' + (e && e.message || e);
  setSync('err', 'Error'); toast(msg);
}

/* don't yank an input out from under someone who is typing */
function scheduleRender(){
  const a = document.activeElement;
  if (a && $('#main').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ pendingRender = true; return; }
  pendingRender = false; render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) scheduleRender(); }, 0));

function setSync(cls, text){ const el = $('#sync'); el.className = cls; el.querySelector('span').textContent = text; }
function syncStatus(){
  if (!CLOUD || !CLOUD.loaded) return;
  if (!navigator.onLine) return setSync('off', 'Offline — will sync');
  const pending = COLS.some(c => CLOUD.meta[c]?.pending);
  const cached  = COLS.every(c => CLOUD.meta[c]?.cache);
  if (pending) return setSync('busy', 'Saving…');
  if (cached)  return setSync('off', 'Connecting…');
  setSync('ok', 'Synced');
}
addEventListener('online', syncStatus); addEventListener('offline', syncStatus);

function startListeners(){
  const { F, db } = CLOUD;
  CLOUD.remote = {}; CLOUD.meta = {}; CLOUD.loaded = false; CLOUD.blocked = new Set();
  const ready = new Set(), server = new Set();
  $('#main').innerHTML = '<div class="panel">Loading yard…</div>';
  setSync('busy', 'Loading…');
  const tryLoad = () => {
    if (ready.size < COLS.length) return;
    if (CLOUD.loaded){ S = fromRemote(); autoSnapshot(); scheduleRender(); syncStatus(); return; }
    const anyData = COLS.some(c => CLOUD.remote[c].size > 0);
    const confirmed = COLS.every(c => server.has(c) || CLOUD.blocked.has(c));
    /* Only treat the database as brand new once the SERVER says it's empty.
       A fresh browser's local cache is empty too — never seed from that. */
    if (!confirmed && !anyData) return;
    firstLoad(confirmed);
    syncStatus();
  };
  CLOUD.unsubs = COLS.map(c => F.onSnapshot(F.collection(db, c), { includeMetadataChanges: true }, snap => {
    const m = new Map(); snap.forEach(d => m.set(d.id, stable(d.data())));
    CLOUD.remote[c] = m;
    CLOUD.meta[c] = { pending: snap.metadata.hasPendingWrites, cache: snap.metadata.fromCache };
    if (!snap.metadata.fromCache) server.add(c);
    ready.add(c);
    tryLoad();
  }, err => {
    console.error(c, err);
    /* one collection refused (e.g. rules not updated): carry on without it, never write to it */
    CLOUD.blocked.add(c); CLOUD.remote[c] = new Map(); ready.add(c);
    if (err.code === 'permission-denied'){
      if (CLOUD.blocked.size === COLS.length){
        $('#main').innerHTML = `<div class="panel"><h2>No access</h2><p>Firebase refused access. Check the Firestore rules have been published (Firestore Database → Rules) and Anonymous sign-in is turned on.</p></div>`;
        return;
      }
      toast(`Firestore rules need updating — paste the latest firestore.rules into Firebase and Publish (blocked: ${c})`);
    }
    tryLoad();
  }));
  /* still nothing from the server after a while */
  setTimeout(() => { if (!CLOUD.loaded && CLOUD.unsubs.length) $('#main').innerHTML = '<div class="panel"><h2>Still loading…</h2><p>Can\'t reach the shared database yet. Check the internet connection. Nothing has been changed.</p></div>'; }, 12000);
}
function firstLoad(confirmed){
  CLOUD.loaded = true;
  const empty = COLS.every(c => CLOUD.remote[c].size === 0);
  if (!empty || !confirmed){ S = fromRemote(); autoSnapshot(); render(); return; }
  /* brand-new project (confirmed by the server): seed it, offering to bring this device's data up */
  let local = null; try { local = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  const hasLocal = local && ((local.containers||[]).length || (local.history||[]).length || (local.prefixes||[]).length);
  S = defaults();
  if (hasLocal && confirm('The shared database is empty. Upload the data already on this device to it?')){
    S = migrate(Object.assign(defaults(), local));
    for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
  }
  cloudPush(); render(); toast('Shared database set up');
}

/* ---------- automatic backups on this device ----------
   Every change is kept in this browser (last 40 versions, one per 5 minutes),
   so a mistake can be rolled back from the Backup tab. */
const SNAP_KEY = 'containertracks:snapshots';
function getSnaps(){ try { return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; } catch(e){ return []; } }
function autoSnapshot(){
  const hasData = S.containers.length || S.history.length || S.bays.some(b => b.containerId);
  if (!hasData) return;                                   // never back up an empty yard over a full one
  try {
    const snaps = getSnaps(), data = JSON.stringify(S), now = Date.now();
    const last = snaps[snaps.length - 1];
    if (last && last.data === data) return;
    if (last && now - last.t < 5*60*1000) snaps[snaps.length - 1] = { t: now, data };
    else snaps.push({ t: now, data });
    while (snaps.length > 40) snaps.shift();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
  } catch(e) {}
}
const summarise = d => {
  const inBays = (d.bays||[]).filter(b => b.containerId).length;
  return `${inBays} in bays · ${(d.containers||[]).length} containers · ${(d.history||[]).length} loads`;
};
function restoreData(d, label){
  if (!confirm(`Restore ${label}?\n\n${summarise(d)}\n\nThis replaces the current data${CLOUD ? ' for everyone' : ''}.`)) return;
  S = migrate(Object.assign(defaults(), d));
  for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
  save(); render(); toast('Restored');
}
function restoreSnap(i){ const sn = getSnaps()[i]; restoreData(JSON.parse(sn.data), 'the version from ' + fmtDate(new Date(sn.t).toISOString())); }
function restoreLocal(){ try { restoreData(JSON.parse(localStorage.getItem(KEY)), 'the data saved on this device before syncing'); } catch(e){ toast('Nothing saved on this device'); } }

/* called by the module script once the Firebase SDK has loaded */
window.cloudStart = ctx => {
  CLOUD = Object.assign(ctx, { loaded:false, remote:{}, meta:{}, unsubs:[] });
  $('#sync').classList.remove('hidden');
  ctx.A.onAuthStateChanged(ctx.auth, user => {
    CLOUD.unsubs.forEach(u => u()); CLOUD.unsubs = []; CLOUD.loaded = false;
    if (!user){
      if (window.CT_REQUIRE_LOGIN){
        $('#login').classList.remove('hidden'); $('#who').classList.add('hidden'); setSync('', 'Signed out');
        setTimeout(() => $('#li-email').focus(), 50); return;
      }
      /* no login screen: sign in silently in the background */
      setSync('busy', 'Connecting…');
      ctx.A.signInAnonymously(ctx.auth).catch(e => {
        cloudFail(e.code === 'auth/operation-not-allowed' || e.code === 'auth/admin-restricted-operation'
          ? new Error('Anonymous sign-in is not turned on in Firebase (Authentication → Sign-in method → Anonymous).') : e);
      });
      return;
    }
    $('#login').classList.add('hidden');
    if (!user.isAnonymous){ $('#who').classList.remove('hidden'); $('#who span').textContent = user.email; }
    startListeners();
  });
};
window.cloudFail = e => {
  console.error(e);
  $('#main').innerHTML = `<div class="panel"><h2>Can't reach Firebase</h2><p>Check the internet connection and reload. (${esc(e && e.message || e)})</p><button class="primary" onclick="location.reload()">Retry</button></div>`;
};
async function cloudSignIn(ev){
  ev.preventDefault();
  const btn = $('#li-btn'); btn.disabled = true; $('#li-err').textContent = '';
  try { await CLOUD.A.signInWithEmailAndPassword(CLOUD.auth, $('#li-email').value.trim(), $('#li-pass').value); $('#li-pass').value = ''; }
  catch(e){ $('#li-err').textContent = /invalid|wrong|not-found|credential/.test(e.code||'') ? 'Wrong email or password.' : (e.message || 'Sign-in failed'); }
  btn.disabled = false;
}
async function cloudReset(){
  const email = $('#li-email').value.trim();
  if (!email) return $('#li-err').textContent = 'Type your email first, then click Forgot password.';
  try { await CLOUD.A.sendPasswordResetEmail(CLOUD.auth, email); $('#li-err').textContent = 'Password reset email sent.'; }
  catch(e){ $('#li-err').textContent = e.message; }
}
function cloudSignOut(){ if (confirm('Sign out?')) CLOUD.A.signOut(CLOUD.auth); }

/* ---------- start ---------- */
if (window.FIREBASE_CONFIG){ S = defaults(); $('#main').innerHTML = '<div class="panel">Connecting…</div>'; }
else { load(); render(); }
</script>

<script type="module">
  /* Firebase SDK — only loaded when firebase-config.js has a config */
  if (window.FIREBASE_CONFIG){
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    try {
      const [{ initializeApp }, A, F] = await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = initializeApp(window.FIREBASE_CONFIG);
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch(e){ db = F.getFirestore(app); }   // e.g. private browsing: no offline cache
      window.cloudStart({ app, auth: A.getAuth(app), A, db, F });
    } catch(e){ window.cloudFail(e); }
  }
</script>
</body>
</html>
