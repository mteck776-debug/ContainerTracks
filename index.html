   and save the setup as a named quick view.
   ========================================================= */
const RPT_COLS = [
  // key, label, numeric?, total?, default visible?
  ['date',      'Date',            false, false, true ],
  ['src',       'Type',            false, false, true ],
  ['material',  'Material',        false, false, true ],
  ['company',   'Company',         false, false, true ],
  ['container', 'Container out',   false, false, true ],
  ['bay',       'Bay',             false, false, false],
  ['order',     'Order no.',       false, false, true ],
  ['rego',      'Rego',            false, false, false],
  ['inId',      'Container in',    false, false, false],
  ['bales',     'Bales',           true,  true,  true ],
  ['target',    'Target',          true,  false, false],
  ['est',       'Est. load',       true,  true,  false],
  ['weighIn',   '1st weigh',       true,  false, false],
  ['weighOut',  '2nd weigh',       true,  false, false],
  ['net',       'Net (weighed)',   true,  true,  true ],
  ['perBale',   't / bale',        true,  false, true ],
  ['diff',      'vs bale est.',    true,  true,  false],
];
const RPT_DEFAULT = () => ({ preset: 'all', from: '', to: '', src: [], materials: [], companies: [], weighed: 'all', search: '',
  sort: { key: 'date', dir: -1 }, group: '', cols: RPT_COLS.filter(c => c[4]).map(c => c[0]), showCharts: true, chartMeasure: 'net' });
const RPT_KEY = 'containertracks:report';
let RPT = (() => { try { return Object.assign(RPT_DEFAULT(), JSON.parse(localStorage.getItem(RPT_KEY)) || {}); } catch(e){ return RPT_DEFAULT(); } })();
let RPT_ACTIVE = null;
let RPT_COLS_OPEN = false;                   // keep the Columns list open while ticking boxes
function rptSet(patch){ Object.assign(RPT, patch); try { localStorage.setItem(RPT_KEY, JSON.stringify(RPT)); } catch(e) {} render(); }

function reportRows(){
  const rows = S.history.map(x => { const c = hCalc(x); return { id: x.id, kind: 'container', ts: x.date, day: ymd(x.date),
    src: 'Container', material: x.material, company: x.company || '', container: x.outId, bay: x.bay, order: x.orderNo || '', rego: x.rego || '',
    inId: x.inId || '', bales: x.bales, target: x.target ?? null, est: x.estNet, weighIn: x.weighIn, weighOut: x.actualOut,
    net: c.actualNet, perBale: c.perBale, diff: c.actualNet != null ? c.actualNet - x.estNet : null }; });
  S.loads.filter(l => l.weighOut != null).forEach(l => {     // finished truck loads only
    const net = l.tare != null ? l.weighOut - l.tare : null, kgb = anyMat(l.material).baleKg || null;
    const est = l.bales && kgb ? l.bales * kgb : null;
    const lot = l.lotId ? S.lots.find(x => x.id === l.lotId) : null;
    rows.push({ id: l.id, kind: 'truck', ts: l.date + 'T12:00:00', day: l.date, src: lot ? 'CRS lot' : 'Truck', material: l.material, company: l.company || '',
      container: '', bay: '', order: lot ? lot.lotNo : '', rego: l.rego || '', inId: '', bales: l.bales ?? null, target: null, est,
      weighIn: l.tare, weighOut: l.weighOut, net, perBale: net != null && l.bales ? net / l.bales : null, diff: net != null && est != null ? net - est : null });
  });
  return rows;
}
function presetRange(p){
  const t = new Date(), d = x => ymd(x), y = t.getFullYear(), mo = t.getMonth();
  if (p === 'today') return [d(t), d(t)];
  if (p === 'week'){ const s = new Date(t); s.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return [d(s), d(t)]; }
  if (p === '7d'){ const s = new Date(t); s.setDate(t.getDate() - 6); return [d(s), d(t)]; }
  if (p === 'month') return [d(new Date(y, mo, 1)), d(t)];
  if (p === 'lastmonth') return [d(new Date(y, mo - 1, 1)), d(new Date(y, mo, 0))];
  if (p === 'fy'){ const fy = mo >= 6 ? y : y - 1; return [d(new Date(fy, 6, 1)), d(t)]; }
  if (p === 'lastfy'){ const fy = (mo >= 6 ? y : y - 1) - 1; return [d(new Date(fy, 6, 1)), d(new Date(fy + 1, 5, 30))]; }
  return [null, null];
}
function filteredRows(cfg = RPT){
  const [pf, pt] = cfg.preset === 'custom' ? [cfg.from || null, cfg.to || null] : presetRange(cfg.preset);
  const q = (cfg.search || '').trim().toUpperCase();
  let rows = reportRows().filter(r =>
    (!pf || r.day >= pf) && (!pt || r.day <= pt) &&
    (!cfg.src.length || cfg.src.includes(r.src)) &&
    (!cfg.materials.length || cfg.materials.includes(r.material)) &&
    (!cfg.companies.length || cfg.companies.includes(r.company || '(none)')) &&
    (cfg.weighed === 'all' || (cfg.weighed === 'yes' ? r.net != null : r.net == null)) &&
    (!q || [r.container, r.inId, r.order, r.rego, r.company, r.material].some(v => String(v || '').toUpperCase().includes(q))));
  const k = cfg.sort.key === 'date' ? 'ts' : cfg.sort.key, dir = cfg.sort.dir;
  rows.sort((a, b) => { const x = a[k], y = b[k];
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * dir || String(b.ts).localeCompare(String(a.ts)); });
  return rows;
}
const groupKey = (r, g) => g === 'material' ? r.material : g === 'company' ? (r.company || '(no company)') : g === 'src' ? r.src
  : g === 'month' ? new Date(r.day + 'T12:00:00').toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })
  : g === 'week' ? 'Week of ' + fmtDay(presetWeekStart(r.day)) : '';
function presetWeekStart(day){ const t = new Date(day + 'T12:00:00'); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return ymd(t); }
function cellText(r, k){
  const v = r[k];
  if (k === 'date') return fmtDate(r.ts).replace(/, 12:00 pm$/, '');
  if (['est','weighIn','weighOut','net','diff'].includes(k)) return v == null ? '—' : k === 'diff' ? signed(v) : kg(v);
  if (k === 'perBale') return v == null ? '—' : bt(v);
  return v == null || v === '' ? '—' : String(v);
}
function totals(rows){
  const sum = k => rows.reduce((s, r) => s + (r[k] || 0), 0);
  const weighed = rows.filter(r => r.net != null && r.bales);
  const wb = weighed.reduce((s, r) => s + r.bales, 0), wn = weighed.reduce((s, r) => s + r.net, 0);
  return { n: rows.length, bales: sum('bales'), est: sum('est'), net: sum('net'), diff: sum('diff'), perBale: wb ? wn / wb : null };
}

/* ---------- report charts (follow the current filters) ----------
   Colour follows the entity: materials use their own colours everywhere;
   companies (no colours of their own) use one blue. */
const CH_BLUE = '#257de0';
const CH_MEASURES = [['net', 'Net tonnes'], ['bales', 'Bales'], ['loads', 'Loads']];
const chVal = (r, m) => m === 'net' ? (r.net || 0) : m === 'bales' ? (r.bales || 0) : 1;
const chFmt = (v, m) => m === 'net' ? tn(v) : Math.round(v).toLocaleString('en-AU');
const chAxis = (v, m) => m === 'net' ? (v / 1000).toLocaleString('en-AU', { maximumFractionDigits: 1 }) + ' t' : Math.round(v).toLocaleString('en-AU');
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

/* horizontal bars: [{label, value, color}] */
function hBars(items, m, title){
  if (!items.length) return '';
  const W = 560, L = 150, R = 70, rowH = 26, H = items.length * rowH + 8, max = niceMax(Math.max(...items.map(i => i.value)));
  const x = v => (W - L - R) * v / max;
  return `<div class="chart"><div class="ch-title">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">
      ${items.map((it, i) => { const y = i * rowH + 4, w = Math.max(it.value > 0 ? 2 : 0, x(it.value));
        return `<g class="ch-hit" data-tip="${esc(`<b>${it.label}</b><br>${chFmt(it.value, m)}${it.extra ? '<br>' + it.extra : ''}`)}">
          <rect x="0" y="${y - 2}" width="${W}" height="${rowH}" fill="transparent"/>
          <text x="${L - 8}" y="${y + 14}" text-anchor="end" class="ch-lbl">${esc(it.label.length > 22 ? it.label.slice(0, 21) + '…' : it.label)}</text>
          <rect x="${L}" y="${y + 2}" width="${w}" height="${rowH - 10}" rx="3" fill="${esc(it.color)}"/>
          <text x="${L + w + 6}" y="${y + 14}" class="ch-val">${chFmt(it.value, m)}</text></g>`; }).join('')}
    </svg></div>`;
}

/* columns over time, stacked by material */
function timeChart(rows, m){
  if (!rows.length) return '';
  /* cover the whole filtered period, not just the days that had loads */
  const [pf, pt] = RPT.preset === 'custom' ? [RPT.from || null, RPT.to || null] : presetRange(RPT.preset);
  const days = rows.map(r => r.day).sort();
  const first = pf && pf < days[0] ? pf : days[0], last = pt && pt > days[days.length - 1] ? pt : days[days.length - 1];
  const span = (new Date(last) - new Date(first)) / 864e5;
  const unit = span <= 31 ? 'day' : span <= 140 ? 'week' : 'month';
  const keyOf = d => unit === 'day' ? d : unit === 'week' ? presetWeekStart(d) : d.slice(0, 7);
  const labelOf = k => unit === 'month' ? new Date(k + '-15T12:00:00').toLocaleDateString('en-AU', { month: 'short', year: '2-digit' })
    : new Date(k + 'T12:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  /* every bucket in the range, so gaps show as gaps */
  const keys = []; let d = new Date(keyOf(first) + (unit === 'month' ? '-01' : '') + 'T12:00:00'); const end = keyOf(last);
  while (keys.length < 400){ const k = unit === 'month' ? ymd(d).slice(0, 7) : ymd(d); if (k > end) break; keys.push(k);
    if (unit === 'day') d.setDate(d.getDate() + 1); else if (unit === 'week') d.setDate(d.getDate() + 7); else d.setMonth(d.getMonth() + 1); }
  const order = [...S.materials, ...S.crsMaterials].map(x => x.code).filter(c => rows.some(r => r.material === c));
  rows.forEach(r => { if (!order.includes(r.material)) order.push(r.material); });
  const B = keys.map(k => { const parts = {}; rows.filter(r => keyOf(r.day) === k).forEach(r => parts[r.material] = (parts[r.material] || 0) + chVal(r, m));
    return { k, parts, total: Object.values(parts).reduce((a, b) => a + b, 0) }; });
  const W = 1120, H = 260, L = 56, R = 10, T = 10, Bt = 30, max = niceMax(Math.max(...B.map(b => b.total), 0));
  const plotW = W - L - R, plotH = H - T - Bt, slot = plotW / B.length, bw = Math.max(3, Math.min(48, slot * 0.7));
  const y = v => T + plotH - plotH * v / max, every = Math.ceil(B.length / 14);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" class="ch-grid"/>
      <text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end" class="ch-axis">${chAxis(max * f, m)}</text>`).join('');
  const cols = B.map((b, i) => { const cx = L + slot * i + slot / 2; let acc = 0;
    const segs = order.filter(c => b.parts[c]).map(c => { const v = b.parts[c], y0 = y(acc), y1 = y(acc + v); acc += v;
      return `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="${esc(anyMat(c).color)}" stroke="#fff" stroke-width="1"/>`; }).join('');
    const tip = `<b>${labelOf(b.k)}${unit === 'week' ? ' (week)' : ''}</b><br>${b.total ? order.filter(c => b.parts[c]).map(c => `${c}: ${chFmt(b.parts[c], m)}`).join('<br>') + `<br><b>Total ${chFmt(b.total, m)}</b>` : 'Nothing'}`;
    return `<g class="ch-hit" data-tip="${esc(tip)}"><rect x="${L + slot * i}" y="${T}" width="${slot}" height="${plotH}" fill="transparent"/>${segs}
      ${i % every === 0 ? `<text x="${cx}" y="${H - 10}" text-anchor="middle" class="ch-axis">${labelOf(b.k)}</text>` : ''}</g>`; }).join('');
  const legend = order.length > 1 ? `<div class="ch-legend">${order.map(c => `<span><i style="background:${esc(anyMat(c).color)}"></i>${esc(c)}</span>`).join('')}</div>` : '';
  return `<div class="chart wide"><div class="ch-title">${CH_MEASURES.find(x => x[0] === m)[1]} by ${unit}${order.length > 1 ? ', by material' : ` — ${esc(order[0] || '')}`}</div>${legend}
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Over time">${grid}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>${cols}</svg></div>`;
}

function chartsPanel(rows){
  const m = RPT.chartMeasure || 'net';
  const sumBy = key => { const g = new Map(); rows.forEach(r => { const k = key(r); const o = g.get(k) || { value: 0, n: 0, net: 0, bales: 0 }; o.value += chVal(r, m); o.n++;
    if (r.net != null && r.bales){ o.net += r.net; o.bales += r.bales; } g.set(k, o); }); return [...g.entries()].sort((a, b) => b[1].value - a[1].value); };
  const byMat = sumBy(r => r.material).map(([k, o]) => ({ label: k, value: o.value, color: anyMat(k).color, extra: `${o.n} load${o.n === 1 ? '' : 's'}${o.bales ? ` · ${bt(o.net / o.bales)} per bale` : ''}` }));
  const byCo = sumBy(r => r.company || '(no company)').slice(0, 12).map(([k, o]) => ({ label: k, value: o.value, color: CH_BLUE, extra: `${o.n} load${o.n === 1 ? '' : 's'}` }));
  const label = CH_MEASURES.find(x => x[0] === m)[1];
  return `<div class="panel charts-panel">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px">
      <h2 style="margin:0">Charts</h2>
      <div class="hrow noprint">${CH_MEASURES.map(([v, l]) => `<button class="fchip ${m === v ? 'on' : ''}" onclick="rptSet({chartMeasure:'${v}'})">${l}</button>`).join('')}
        <button class="small" onclick="rptSet({showCharts:false})">Hide charts</button></div>
    </div>
    ${m === 'net' && rows.some(r => r.net == null) ? `<p class="muted" style="margin:0 0 6px">Loads still needing a 2nd weigh aren't counted in net tonnes.</p>` : ''}
    ${rows.length ? `${timeChart(rows, m)}<div class="ch-grid2">${hBars(byMat, m, `${label} by material`)}${hBars(byCo, m, `${label} by company${sumBy(r => r.company).length > 12 ? ' (top 12)' : ''}`)}</div>`
      : '<p class="muted">No loads match the filters.</p>'}
  </div>`;
}
/* one tooltip for every chart */
document.addEventListener('mousemove', e => {
  const g = e.target.closest && e.target.closest('.ch-hit'), tip = document.getElementById('ch-tip');
  if (!g){ if (tip) tip.style.display = 'none'; return; }
  const t = tip || Object.assign(document.body.appendChild(document.createElement('div')), { id: 'ch-tip' });
  t.innerHTML = g.dataset.tip; t.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = e.clientY + 14 + t.offsetHeight > innerHeight ? e.clientY - t.offsetHeight - 10 : e.clientY + 14;
  t.style.left = x + 'px'; t.style.top = y + 'px';
});

      <td class="noprint" style="white-space:nowrap">${r.kind === 'container'

function rptSort(k){ RPT.sort = RPT.sort.key === k ? { key: k, dir: -RPT.sort.dir } : { key: k, dir: k === 'date' ? -1 : (RPT_COLS.find(c => c[0] === k)[2] ? -1 : 1) }; rptSet({}); }

function saveHist(id){

function exportCSV(){

  const val = (r, k) => ['est','weighIn','weighOut','net','diff','perBale'].includes(k) ? (r[k] == null ? '' : (r[k] / 1000).toFixed(3))
    : k === 'date' ? r.day.split('-').reverse().join('/') : (r[k] ?? '');

function recoveryPanel(){
  const snaps = getSnaps();
  let local = null; try { local = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  const hasLocal = CLOUD && local && ((local.containers||[]).length || (local.history||[]).length);
  return `<div class="panel">
    <h2>Recover earlier data</h2>
    <p class="muted">This browser keeps the 5 most recent automatic copies as you work (at least 30 minutes apart). If something goes missing, restore an earlier version here. Copies only exist on the device where the work was done, so check the PC or tablet the containers were entered on.</p>
    ${hasLocal ? `<div class="note" style="margin-bottom:10px">This device has data saved from <b>before the shared database</b>: ${summarise(local)}. <button class="small primary" onclick="restoreLocal()">Restore it</button></div>` : ''}
    ${snaps.length ? `<div class="tbl-wrap"><table><tr><th>Saved</th><th>Contents</th><th></th></tr>
      ${snaps.map((sn, i) => ({ sn, i })).reverse().map(({ sn, i }) => { let d = {}; try { d = JSON.parse(sn.data); } catch(e) {}
        return `<tr><td>${fmtDate(new Date(sn.t).toISOString())}</td><td>${summarise(d)}</td><td><button class="small" onclick="restoreSnap(${i})">Restore</button></td></tr>`; }).join('')}

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function restore(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.bays || !d.materials) throw 0;
      if (!confirm('Replace all current data with this backup?')) return;
      S = Object.assign(defaults(), d); for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
      save(); render(); toast('Backup restored');
    } catch(e){ toast('That file is not an MRF Life backup'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if (!confirm('Delete ALL containers, bays, trucks and history? Download a backup first if unsure.')) return;
  S = defaults(); save(); render(); toast('Reset done');
}

/* =========================================================
   FIREBASE SYNC
   ========================================================= */
const COLS = ['bays','containers','prefixes','materials','trucks','history','settings','loads'];
let CLOUD = null;          // set once firebase-config.js + SDK are loaded
let pendingRender = false;

const enc = s => encodeURIComponent(String(s)).replace(/\./g, '%2E');
const clean = o => JSON.parse(JSON.stringify(o));               // drops undefined (Firestore rejects it)
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);

function toDocs(st){
  const out = {}; COLS.forEach(c => out[c] = new Map());
  st.bays.forEach(b => out.bays.set(String(b.n), { ...b, log: [] }));
  st.containers.forEach(c => out.containers.set(enc(c.id), c));
  st.prefixes.forEach(p => out.prefixes.set(enc(p.prefix), p));
  st.materials.forEach((m, i) => out.materials.set(enc(m.code), { ...m, _i: i }));
  Object.entries(st.trucks).forEach(([r, t]) => out.trucks.set(enc(r), { rego: r, ...t }));
  st.history.forEach(h => out.history.set(h.id, h));
  out.settings.set('booking', st.settings);
  out.settings.set('companies', { names: st.companies });
  out.settings.set('truckConfigs', { list: st.truckConfigs });
  out.settings.set('forms', { byLocation: st.forms || {} });
  out.settings.set('crs', { lots: st.lots || [], materials: st.crsMaterials || [] });
  out.settings.set('locations', { list: st.deliveryLocations || [] });
  out.settings.set('reports', { list: st.reports || [] });
  out.settings.set('prices', { sheets: st.priceSheets || [] });
  (st.loads||[]).forEach(l => out.loads.set(l.id, l));
  return out;
}
function fromRemote(){
  const vals = c => [...CLOUD.remote[c].values()].map(j => JSON.parse(j));
  const s = defaults(), bays = vals('bays');
  s.bays = s.bays.map(b => Object.assign(newBay(b.n), bays.find(x => x.n === b.n) || {}));
  s.containers = vals('containers');
  s.prefixes = vals('prefixes');
  const mats = vals('materials').sort((a, b) => (a._i ?? 0) - (b._i ?? 0)).map(({ _i, ...m }) => m);
  if (mats.length) s.materials = mats;
  migrate(s);
  s.trucks = {}; vals('trucks').forEach(({ rego, ...t }) => s.trucks[rego] = t);
  s.history = vals('history').sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const sdoc = id => { const j = CLOUD.remote.settings.get(id); return j ? JSON.parse(j) : null; };
  s.settings = Object.assign({}, BOOKING_DEFAULTS, sdoc('booking') || {});
  s.companies = sdoc('companies')?.names || [];
  const cfgs = sdoc('truckConfigs')?.list; if (cfgs && cfgs.length) s.truckConfigs = cfgs;
  s.loads = vals('loads');
  s.reports = sdoc('reports')?.list || [];
  const ps = sdoc('prices')?.sheets; if (ps && ps.length) s.priceSheets = ps;
  const locs = sdoc('locations')?.list; if (locs && locs.length) s.deliveryLocations = locs;
  const crs = sdoc('crs');
  if (crs){ s.lots = crs.lots || []; if (crs.materials?.length) s.crsMaterials = crs.materials; }
  const fd = sdoc('forms') || {};
  s.forms = Object.assign({}, fd.byLocation || {}, fd.genuine ? { genuine: fd.genuine } : {});
  migrate(s);
  return s;
}

/* write only the docs that changed since the last snapshot */
function cloudPush(){
  const L = toDocs(S), R = CLOUD.remote, F = CLOUD.F, ops = [];
  COLS.forEach(c => {
    if (CLOUD.blocked && CLOUD.blocked.has(c)) return;
    L[c].forEach((obj, id) => { const j = stable(clean(obj)); if (R[c].get(id) !== j) ops.push(['set', c, id, j]); });
    R[c].forEach((_, id) => { if (!L[c].has(id)) ops.push(['del', c, id]); });
  });
  for (let i = 0; i < ops.length; i += 400){
    const batch = F.writeBatch(CLOUD.db);
    ops.slice(i, i + 400).forEach(([t, c, id, j]) => {
      const ref = F.doc(CLOUD.db, c, id);
      t === 'set' ? batch.set(ref, JSON.parse(j)) : batch.delete(ref);
    });
    batch.commit().catch(cloudErr);     // not awaited: offline writes queue and sync later
  }
  ops.forEach(([t, c, id, j]) => t === 'set' ? R[c].set(id, j) : R[c].delete(id));
  autoSnapshot(); syncStatus();
}
function cloudErr(e){
  console.error(e);
  const msg = e && e.code === 'permission-denied' ? 'No permission — check the Firestore rules' : 'Save failed — ' + (e && e.message || e);
  setSync('err', 'Error'); toast(msg);
}

/* don't yank an input out from under someone who is typing */
function scheduleRender(){
  const a = document.activeElement;
  if (a && $('#main').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ pendingRender = true; return; }
  pendingRender = false; render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) scheduleRender(); }, 0));

function setSync(cls, text){ const el = $('#sync'); el.className = cls; el.querySelector('span').textContent = text; }
function syncStatus(){
  if (!CLOUD || !CLOUD.loaded) return;
  if (!navigator.onLine) return setSync('off', 'Offline — will sync');
  const pending = COLS.some(c => CLOUD.meta[c]?.pending);
  const cached  = COLS.every(c => CLOUD.meta[c]?.cache);
  if (pending) return setSync('busy', 'Saving…');
  if (cached)  return setSync('off', 'Connecting…');
  setSync('ok', 'Synced');
}
addEventListener('online', syncStatus); addEventListener('offline', syncStatus);

function startListeners(){
  const { F, db } = CLOUD;
  CLOUD.remote = {}; CLOUD.meta = {}; CLOUD.loaded = false; CLOUD.blocked = new Set();
  const ready = new Set(), server = new Set();
  $('#main').innerHTML = '<div class="panel">Loading yard…</div>';
  setSync('busy', 'Loading…');
  const tryLoad = () => {
    if (ready.size < COLS.length) return;
    if (CLOUD.loaded){ S = fromRemote(); autoSnapshot(); scheduleRender(); syncStatus(); return; }
    const anyData = COLS.some(c => CLOUD.remote[c].size > 0);
    const confirmed = COLS.every(c => server.has(c) || CLOUD.blocked.has(c));
    /* Only treat the database as brand new once the SERVER says it's empty.
       A fresh browser's local cache is empty too — never seed from that. */
    if (!confirmed && !anyData) return;
    firstLoad(confirmed);
    syncStatus();
  };
  CLOUD.unsubs = COLS.map(c => F.onSnapshot(F.collection(db, c), { includeMetadataChanges: true }, snap => {
    const m = new Map(); snap.forEach(d => m.set(d.id, stable(d.data())));
    CLOUD.remote[c] = m;
    CLOUD.meta[c] = { pending: snap.metadata.hasPendingWrites, cache: snap.metadata.fromCache };
    if (!snap.metadata.fromCache) server.add(c);
    ready.add(c);
    tryLoad();
  }, err => {
    console.error(c, err);
    /* one collection refused (e.g. rules not updated): carry on without it, never write to it */
    CLOUD.blocked.add(c); CLOUD.remote[c] = new Map(); ready.add(c);
    if (err.code === 'permission-denied'){
      if (CLOUD.blocked.size === COLS.length){
        $('#main').innerHTML = `<div class="panel"><h2>No access</h2><p>Firebase refused access. Check the Firestore rules have been published (Firestore Database → Rules) and Anonymous sign-in is turned on.</p></div>`;
        return;
      }
      toast(`Firestore rules need updating — paste the latest firestore.rules into Firebase and Publish (blocked: ${c})`);
    }
    tryLoad();
  }));
  /* still nothing from the server after a while */
  setTimeout(() => { if (!CLOUD.loaded && CLOUD.unsubs.length) $('#main').innerHTML = '<div class="panel"><h2>Still loading…</h2><p>Can\'t reach the shared database yet. Check the internet connection. Nothing has been changed.</p></div>'; }, 12000);
}
function firstLoad(confirmed){
  CLOUD.loaded = true;
  const empty = COLS.every(c => CLOUD.remote[c].size === 0);
  if (!empty || !confirmed){ S = fromRemote(); autoSnapshot(); render(); return; }
  /* brand-new project (confirmed by the server): seed it, offering to bring this device's data up */
  let local = null; try { local = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  const hasLocal = local && ((local.containers||[]).length || (local.history||[]).length || (local.prefixes||[]).length);
  S = defaults();
  if (hasLocal && confirm('The shared database is empty. Upload the data already on this device to it?')){
    S = migrate(Object.assign(defaults(), local));
    for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
  }
  cloudPush(); render(); toast('Shared database set up');
}

/* ---------- automatic backups on this device ----------
   Changes are kept in this browser: the 5 most recent versions, at least 30 minutes apart,
   so a mistake can be rolled back from the Backup tab. */
const SNAP_KEY = 'containertracks:snapshots';
const SNAP_MAX = 5, SNAP_GAP = 30 * 60 * 1000;     // keep 5 backups, at least 30 minutes apart
function getSnaps(){ try { return (JSON.parse(localStorage.getItem(SNAP_KEY)) || []).slice(-SNAP_MAX); } catch(e){ return []; } }
function autoSnapshot(){
  const hasData = S.containers.length || S.history.length || S.bays.some(b => b.containerId);
  if (!hasData) return;                                   // never back up an empty yard over a full one
  try {
    const snaps = getSnaps(), data = JSON.stringify(S), now = Date.now();
    const last = snaps[snaps.length - 1];
    if (last && last.data === data) return;
    if (last && now - last.t < SNAP_GAP) snaps[snaps.length - 1] = { t: now, data };
    else snaps.push({ t: now, data });
    while (snaps.length > SNAP_MAX) snaps.shift();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
  } catch(e) {}
}
const summarise = d => {
  const inBays = (d.bays||[]).filter(b => b.containerId).length;
  return `${inBays} in bays · ${(d.containers||[]).length} containers · ${(d.history||[]).length} loads`;
};
function restoreData(d, label){
  if (!confirm(`Restore ${label}?\n\n${summarise(d)}\n\nThis replaces the current data${CLOUD ? ' for everyone' : ''}.`)) return;
  S = migrate(Object.assign(defaults(), d));
  for (let i = S.bays.length; i < BAY_COUNT; i++) S.bays.push(newBay(i+1));
  save(); render(); toast('Restored');
}
function restoreSnap(i){ const sn = getSnaps()[i]; restoreData(JSON.parse(sn.data), 'the version from ' + fmtDate(new Date(sn.t).toISOString())); }
function restoreLocal(){ try { restoreData(JSON.parse(localStorage.getItem(KEY)), 'the data saved on this device before syncing'); } catch(e){ toast('Nothing saved on this device'); } }

/* called by the module script once the Firebase SDK has loaded */
window.cloudStart = ctx => {
  CLOUD = Object.assign(ctx, { loaded:false, remote:{}, meta:{}, unsubs:[] });
  $('#sync').classList.remove('hidden');
  ctx.A.onAuthStateChanged(ctx.auth, user => {
    CLOUD.unsubs.forEach(u => u()); CLOUD.unsubs = []; CLOUD.loaded = false;
    if (!user){
      if (window.CT_REQUIRE_LOGIN){
        $('#login').classList.remove('hidden'); $('#who').classList.add('hidden'); setSync('', 'Signed out');
        setTimeout(() => $('#li-email').focus(), 50); return;
      }
      /* no login screen: sign in silently in the background */
      setSync('busy', 'Connecting…');
      ctx.A.signInAnonymously(ctx.auth).catch(e => {
        cloudFail(e.code === 'auth/operation-not-allowed' || e.code === 'auth/admin-restricted-operation'
          ? new Error('Anonymous sign-in is not turned on in Firebase (Authentication → Sign-in method → Anonymous).') : e);
      });
      return;
    }
    $('#login').classList.add('hidden');
    if (!user.isAnonymous){ $('#who').classList.remove('hidden'); $('#who span').textContent = user.email; }
    startListeners();
  });
};
window.cloudFail = e => {
  console.error(e);
  $('#main').innerHTML = `<div class="panel"><h2>Can't reach Firebase</h2><p>Check the internet connection and reload. (${esc(e && e.message || e)})</p><button class="primary" onclick="location.reload()">Retry</button></div>`;
};
async function cloudSignIn(ev){
  ev.preventDefault();
  const btn = $('#li-btn'); btn.disabled = true; $('#li-err').textContent = '';
  try { await CLOUD.A.signInWithEmailAndPassword(CLOUD.auth, $('#li-email').value.trim(), $('#li-pass').value); $('#li-pass').value = ''; }
  catch(e){ $('#li-err').textContent = /invalid|wrong|not-found|credential/.test(e.code||'') ? 'Wrong email or password.' : (e.message || 'Sign-in failed'); }
  btn.disabled = false;
}
async function cloudReset(){
  const email = $('#li-email').value.trim();
  if (!email) return $('#li-err').textContent = 'Type your email first, then click Forgot password.';
  try { await CLOUD.A.sendPasswordResetEmail(CLOUD.auth, email); $('#li-err').textContent = 'Password reset email sent.'; }
  catch(e){ $('#li-err').textContent = e.message; }
}
function cloudSignOut(){ if (confirm('Sign out?')) CLOUD.A.signOut(CLOUD.auth); }

/* ---------- start ---------- */
restoreUI();
try { localStorage.setItem(SNAP_KEY, JSON.stringify(getSnaps())); } catch(e) {}   // trim old backups to the newest 5
if (window.FIREBASE_CONFIG){ S = defaults(); $('#main').innerHTML = '<div class="panel">Connecting…</div>'; }
else { load(); render(); }
</script>

<script type="module">
  /* Firebase SDK — only loaded when firebase-config.js has a config */
  if (window.FIREBASE_CONFIG){
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    try {
      const [{ initializeApp }, A, F] = await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = initializeApp(window.FIREBASE_CONFIG);
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch(e){ db = F.getFirestore(app); }   // e.g. private browsing: no offline cache
      window.cloudStart({ app, auth: A.getAuth(app), A, db, F });
    } catch(e){ window.cloudFail(e); }
  }
</script>
</body>
</html>
